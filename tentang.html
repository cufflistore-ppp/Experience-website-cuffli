  <style>
    .about-hero { text-align:center; padding:20px 12px 8px; }
    .about-hero img { width:72px; height:72px; border-radius:16px; object-fit:cover; }
    .about-hero h2 { margin:12px 0 4px; font-size:20px; }
    .about-hero p { color:#8aa0b8; font-size:13px; }
    .about-card {
      background:#12182a; border:1px solid #1e2a45; border-radius:14px;
      padding:14px 16px; margin:10px 12px; font-size:13px; color:#cfd8e3; line-height:1.55;
    }
    .contact-list { padding:0 12px 90px; display:flex; flex-direction:column; gap:10px; }
    .contact-item {
      display:flex; align-items:center; gap:12px; padding:12px 14px;
      background:#12182a; border:1px solid #1e2a45; border-radius:12px;
      text-decoration:none; color:inherit;
    }
    .contact-item .icon-wrap {
      width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
      background:rgba(33,150,243,0.15); color:#42a5f5; flex-shrink:0;
    }
    .contact-item .icon-wrap.wa { background:rgba(37,211,102,0.15); color:#25d366; }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="logo.png" class="logo" alt="VOXY MARKET">
      <div>
        <h1>VOXY <span style="color:#1565c0">MARKET</span> <i class="fa-solid fa-circle-check verified"></i></h1>
        <p>Tentang kami</p>
      </div>
    </div>
  </header>

  <div class="about-hero">
    <img src="logo.png" alt="VOXY MARKET" class="logo">
    <h2 id="aboutNama">VOXY MARKET</h2>
    <p>Digital Store · Order resmi lewat website</p>
  </div>

  <div class="about-card" id="aboutDesc">
    <strong id="aboutCopy">VOXY MARKET</strong> adalah pusat produk digital &amp; jasa. Order, bayar, dan terima produk langsung dari website.
  </div>

  <h3 style="padding:8px 14px 0;font-size:14px;color:#90caf9;">Kontak &amp; Saluran</h3>
  <p style="padding:0 14px;font-size:12px;color:#6a7a90;margin:4px 0 8px;">Dikelola admin — update otomatis di semua device.</p>
  <div class="contact-list" id="contactList"></div>

  <nav class="bottom-nav nav-5">
    <a href="digital.html" class="nav-item"><i class="fa-solid fa-bag-shopping"></i><span>Produk</span></a>
    <a href="kategori.html" class="nav-item"><i class="fa-solid fa-grip"></i><span>Kategori</span></a>
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="antrian.html" class="nav-item"><i class="fa-solid fa-clipboard-list"></i><span>Pesanan</span></a>
    <a href="akun.html" class="nav-item"><i class="fa-solid fa-circle-user"></i><span>Akun</span></a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="global-orders.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="auth.js"></script>
  <script src="auth-guard.js"></script>
  <script src="branding.js"></script>
  <script>
    function iconFor(name, url) {
      var n = String(name || "").toLowerCase();
      var u = String(url || "").toLowerCase();
      if (n.indexOf("wa") >= 0 || u.indexOf("wa.me") >= 0 || u.indexOf("whatsapp") >= 0)
        return { cls: "wa", icon: "fa-brands fa-whatsapp" };
      if (n.indexOf("telegram") >= 0 || u.indexOf("t.me") >= 0)
        return { cls: "", icon: "fa-brands fa-telegram" };
      if (n.indexOf("instagram") >= 0 || u.indexOf("instagram") >= 0)
        return { cls: "", icon: "fa-brands fa-instagram" };
      if (n.indexOf("youtube") >= 0 || u.indexOf("youtube") >= 0 || u.indexOf("youtu.be") >= 0)
        return { cls: "", icon: "fa-brands fa-youtube" };
      if (n.indexOf("channel") >= 0 || n.indexOf("saluran") >= 0)
        return { cls: "wa", icon: "fa-solid fa-bullhorn" };
      return { cls: "", icon: "fa-solid fa-link" };
    }

    function buildLinks(s) {
      var list = [];
      if (s.customLinks && Array.isArray(s.customLinks) && s.customLinks.length) {
        s.customLinks.forEach(function (L) {
          if (L && L.url) list.push({ name: L.name || "Link", url: L.url });
        });
      } else {
        if (s.linkChannel) list.push({ name: "Saluran / Channel", url: s.linkChannel });
        if (s.linkCs) list.push({ name: "CS WhatsApp", url: s.linkCs });
        if (s.linkTelegram) list.push({ name: "Telegram", url: s.linkTelegram });
        if (s.linkIg) list.push({ name: "Instagram", url: s.linkIg });
      }
      // WA admin selalu ada
      var wa = String(s.waAdmin || "6285151982250").replace(/\D/g, "");
      if (wa) {
        var hasWa = list.some(function (x) {
          return String(x.url || "").indexOf("wa.me") >= 0;
        });
        if (!hasWa) list.unshift({ name: "WhatsApp Admin", url: "https://wa.me/" + wa });
      }
      return list;
    }

    function renderContacts(s) {
      s = s || {};
      var nama = s.namaToko || "VOXY MARKET";
      var elN = document.getElementById("aboutNama");
      var elC = document.getElementById("aboutCopy");
      if (elN) elN.textContent = nama;
      if (elC) elC.textContent = nama;
      var box = document.getElementById("contactList");
      if (!box) return;
      var links = buildLinks(s);
      if (!links.length) {
        box.innerHTML = '<p style="color:#6a7a90;font-size:13px;padding:8px;">Belum ada link kontak.</p>';
        return;
      }
      box.innerHTML = links.map(function (L) {
        var ic = iconFor(L.name, L.url);
        return (
          '<a class="contact-item" href="' + String(L.url).replace(/"/g, "") + '" target="_blank" rel="noopener">' +
          '<div class="icon-wrap ' + ic.cls + '"><i class="' + ic.icon + '"></i></div>' +
          '<div><div style="font-weight:700;font-size:14px;">' + String(L.name || "Link").replace(/</g, "") + '</div>' +
          '<div style="font-size:11px;color:#6a7a90;word-break:break-all;">' + String(L.url || "").replace(/</g, "") + '</div></div></a>'
        );
      }).join("");
    }

    async function boot() {
      var s = {};
      try {
        s = JSON.parse(localStorage.getItem("voxyy_settings") || "{}");
      } catch (e) {}
      renderContacts(s);
      try {
        if (window.VoxyyOrders && window.VoxyyOrders.initFirebase) window.VoxyyOrders.initFirebase();
        if (window.VoxyyOrders && window.VoxyyOrders.getSettings) {
          var cloud = await window.VoxyyOrders.getSettings();
          if (cloud && typeof cloud === "object") {
            s = Object.assign({}, s, cloud);
            localStorage.setItem("voxyy_settings", JSON.stringify(s));
            renderContacts(s);
          }
        }
        if (window.VoxyyOrders && window.VoxyyOrders.onSettingsChange) {
          window.VoxyyOrders.onSettingsChange(function (ns) {
            if (ns) {
              localStorage.setItem("voxyy_settings", JSON.stringify(ns));
              renderContacts(ns);
            }
          });
        }
      } catch (e) {}
    }
    document.addEventListener("DOMContentLoaded", boot);
  </script>
  <script src="bgm.js"></script>
</body>
</html>
