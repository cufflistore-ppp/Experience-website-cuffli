<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - VOXY MARKET</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <header class="app-header">
    <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
    <div class="logo-area">
      <img src="logo.png" alt="VOXY">
      <span class="badge-dot" id="logoBadge"></span>
      <span>Chat Admin</span>
    </div>
    <button class="icon-btn" onclick="laporWA()" title="WhatsApp"><i data-lucide="phone"></i></button>
  </header>

  <div class="chat-wrap">
    <div class="chat-messages" id="messages">
      <div class="empty-state">Belum ada pesan. Tulis laporan atau pertanyaanmu.</div>
    </div>
    <div class="chat-input-bar">
      <input id="inputMsg" type="text" placeholder="Tulis pesan / laporan..." autocomplete="off">
      <button onclick="kirim()" id="btnKirim"><i data-lucide="send"></i></button>
    </div>
  </div>

  <script src="global-orders.js"></script>
  <script>
    lucide.createIcons();
    var currentUser = null;
    var waAdmin = "";

    VOXY.requireAuth().then(function (user) {
      currentUser = user;
      VOXY.markChatReadByUser(user.uid);
      VOXY.listenChatMessages(user.uid, renderMessages);
      VOXY.listenUserUnread(user.uid, function (unread) {
        var el = document.getElementById("logoBadge");
        if (el) el.classList.toggle("show", !!unread);
        if (unread) VOXY.markChatReadByUser(user.uid);
      });
      VOXY.getSettings().then(function (s) {
        waAdmin = (s && s.waAdmin) || "";
      });
    });

    function renderMessages(list) {
      var box = document.getElementById("messages");
      if (!list || !list.length) {
        box.innerHTML = '<div class="empty-state">Belum ada pesan. Tulis laporan atau pertanyaanmu.</div>';
        return;
      }
      box.innerHTML = list.map(function (m) {
        var cls = m.from === "admin" ? "msg-admin" : "msg-user";
        return '<div class="msg ' + cls + '">' + escapeHtml(m.text || "") +
          '<small>' + VOXY.formatTanggal(m.at) + '</small></div>';
      }).join("");
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(s) {
      var d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function kirim() {
      var input = document.getElementById("inputMsg");
      var text = (input.value || "").trim();
      if (!text || !currentUser) return;
      var btn = document.getElementById("btnKirim");
      btn.disabled = true;
      VOXY.kirimPesanUser(currentUser.uid, currentUser.email, text).then(function () {
        input.value = "";
        btn.disabled = false;
        input.focus();
      }).catch(function (e) {
        alert(e.message || "Gagal kirim");
        btn.disabled = false;
      });
    }

    document.getElementById("inputMsg").addEventListener("keydown", function (e) {
      if (e.key === "Enter") kirim();
    });

    function laporWA() {
      VOXY.bukaWhatsApp(waAdmin, "Halo admin VOXY MARKET, saya mau tanya/lapor:");
    }
  </script>
</body>
</html>
