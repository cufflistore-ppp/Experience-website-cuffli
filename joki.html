<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jelajahi Produk - VOXY MARKET</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="market-page">

  <!-- Header VOXY MARKET style -->
  <header class="market-header">
    <div class="market-brand">
      <div class="vx-badge">VX</div>
      <div class="market-title">VOXY <span>MARKET</span></div>
    </div>
    <a href="akun.html" class="market-user"><i class="fa-solid fa-user"></i></a>
  </header>

  <div class="top-notif" id="topNotif" style="display:none;"></div>

  <div class="market-content">
    <h1 class="market-heading">Semua Produk</h1>
    <p class="market-sub">Pilih produk, jasa, atau layanan yang ingin kamu beli.</p>

    <!-- Search -->
    <div class="market-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchProduk" placeholder="Cari produk..." autocomplete="off" oninput="onSearchProduk()">
    </div>

    <!-- Category chips -->
    <div class="market-cats" id="filterTabs">
      <button class="cat-chip active" data-cat="all" onclick="filterPaket('all')">Semua</button>
      <button class="cat-chip" data-cat="joki" onclick="filterPaket('joki')">Joki</button>
      <button class="cat-chip" data-cat="jasa" onclick="filterPaket('jasa')">Jasa</button>
      <button class="cat-chip" data-cat="layanan" onclick="filterPaket('layanan')">Layanan</button>
      <button class="cat-chip" data-cat="digital" onclick="filterPaket('digital')">Digital</button>
    </div>

    <!-- Product grid 2 kolom -->
    <div class="market-grid" id="paketList"></div>
  </div>

  <nav class="bottom-nav nav-5">
    <a href="joki.html" class="nav-item active"><i class="fa-solid fa-bag-shopping"></i><span>Produk</span></a>
    <a href="digital.html" class="nav-item"><i class="fa-solid fa-grip"></i><span>Kategori</span></a>
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="antrian.html" class="nav-item"><i class="fa-solid fa-clipboard-list"></i><span>Pesanan</span></a>
    <a href="akun.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Akun</span></a>
  </nav>

  <script src="joki-produk.js"></script>
  <script src="telegram.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="global-orders.js"></script>
  <script src="script.js"></script>
</body>
</html>
