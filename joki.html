<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joki Kontak - VOXY MARKET</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <header class="app-header">
    <button class="icon-btn" onclick="location.href='home.html'"><i data-lucide="arrow-left"></i></button>
    <div class="logo-area"><span>Joki Kontak</span></div>
    <div style="width:40px"></div>
  </header>

  <main class="page">
    <div class="joki-box">
      <div class="joki-box-head">
        <span class="joki-step">1</span>
        <span>Pilih Paket Joki</span>
      </div>
      <div id="jokiList"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html"><i data-lucide="home"></i>Home</a>
    <a href="riwayat.html"><i data-lucide="receipt"></i>Transaksi</a>
    <a href="akun.html"><i data-lucide="user"></i>Akun</a>
  </nav>

  <script src="global-orders.js"></script>
  <script>
    lucide.createIcons();
    var PAKET = [
      { id: "joki-20jam", nama: "Joki 20 Jam", desc: "20 jam + SW + share 10GB", harga: 500 },
      { id: "joki-1hari", nama: "Joki 1 Hari", desc: "1 hari + SW + share all GB", harga: 1000 },
      { id: "joki-2hari", nama: "Joki 2 Hari", desc: "2 hari + SW + share all GB", harga: 2000 },
      { id: "joki-3hari", nama: "Joki 3 Hari", desc: "3 hari + SW + share all GB", harga: 3000 },
      { id: "joki-4hari", nama: "Joki 4 Hari", desc: "4 hari + SW + share all GB", harga: 4000 },
      { id: "joki-5hari", nama: "Joki 5 Hari", desc: "5 hari + SW + share all GB", harga: 5000 },
      { id: "joki-permanen", nama: "Joki Permanen", desc: "Permanen link tree + SW tebar", harga: 6000 }
    ];
    document.getElementById("jokiList").innerHTML = PAKET.map(function (p) {
      return (
        '<div class="joki-row">' +
          '<div class="joki-row-info">' +
            '<div class="joki-row-name">' + p.nama + '</div>' +
            '<div class="joki-row-desc">' + p.desc + '</div>' +
          '</div>' +
          '<div class="joki-row-right">' +
            '<span class="joki-row-price">' + VOXY.formatRp(p.harga) + '</span>' +
            '<a class="joki-row-btn" href="joki-order.html?id=' + encodeURIComponent(p.id) + '">Pilih</a>' +
          '</div>' +
        '</div>'
      );
    }).join("");
    VOXY.requireAuth().then(function () {});
  </script>
</body>
</html>
