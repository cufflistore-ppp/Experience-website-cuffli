<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layanan - VOXY MARKET</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <header class="app-header">
    <button class="icon-btn" onclick="location.href='home.html'"><i data-lucide="arrow-left"></i></button>
    <div class="logo-area"><span id="pageTitle">Layanan</span></div>
    <div style="width:40px"></div>
  </header>

  <main class="page layanan-page">
    <div class="flash-box" id="flashBox" style="display:none">
      <div class="flash-top">
        <h2><i data-lucide="flame" style="width:16px;height:16px;color:#fb923c"></i> Flash Sale</h2>
        <div class="flash-timer" id="flashTimer">--:--:--</div>
      </div>
      <div class="flash-row" id="flashRow"></div>
    </div>

    <div class="home-produk-head">
      <h2 id="listTitle">Produk</h2>
      <span class="count" id="listCount"></span>
    </div>
    <div id="produkGrid" class="paket-grid">
      <div class="empty-state home-loading" style="grid-column:1/-1">Memuat...</div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html"><i data-lucide="home"></i>Home</a>
    <a href="riwayat.html"><i data-lucide="receipt"></i>Transaksi</a>
    <a href="akun.html"><i data-lucide="user"></i>Akun</a>
  </nav>

  <script src="global-orders.js"></script>
  <script>
    lucide.createIcons();
    var params = new URLSearchParams(location.search);
    var kat = (params.get("kat") || "").trim();
    var judul = (params.get("judul") || kat || "Layanan").trim();
    document.getElementById("pageTitle").textContent = judul;
    document.getElementById("listTitle").textContent = judul;
    document.title = judul + " - VOXY MARKET";

    function isFlash(p) {
      if (!p) return false;
      var on = p.flashSale === true || p.flashSale === "true" || p.flashSale === 1 || p.flashSale === "1";
      if (!on) return false;
      var end = Number(p.flashEnd || 0);
      if (!end) return true;
      return Date.now() < end;
    }
    function hargaTampil(p) {
      var normal = Number(p.harga) || 0;
      if (!isFlash(p)) return normal;
      var disc = Number(p.flashDiskon) || 0;
      if (disc > 0 && disc < 100) return Math.round(normal * (100 - disc) / 100);
      if (p.flashHarga != null && Number(p.flashHarga) > 0) return Number(p.flashHarga);
      return normal;
    }
    function matchCat(p, cat) {
      var k = ((p.kategori || "") + "").trim().toLowerCase();
      var c = (cat || "").trim().toLowerCase();
      if (!c) return true;
      return k === c || k.indexOf(c) !== -1 || c.indexOf(k) !== -1;
    }
    function iconCard(p) {
      var img = p.gambar || "produk1.png";
      var stokNum = (p.stok != null) ? Number(p.stok) : null;
      var habis = p.stokHabis || (stokNum !== null && stokNum <= 0);
      var normal = Number(p.harga) || 0;
      var now = hargaTampil(p);
      var flash = isFlash(p);
      var disc = 0;
      if (flash && normal > 0 && now < normal) {
        disc = Number(p.flashDiskon) || Math.round((1 - now / normal) * 100);
      }
      var desc = (p.deskripsi || p.kategori || "Layanan digital VOXY MARKET").replace(/</g, "&lt;");
      if (desc.length > 90) desc = desc.slice(0, 87) + "...";
      var badgeLeft = habis
        ? '<span class="paket-badge habis">Habis</span>'
        : (flash
          ? '<span class="paket-badge flash">Flash' + (disc > 0 ? " -" + disc + "%" : "") + '</span>'
          : '<span class="paket-badge">' + (p.kategori || "Produk") + '</span>');
      var badgePop = flash && !habis ? '<span class="paket-populer">FLASH</span>' : "";
      var fitur =
        '<ul class="paket-fitur">' +
          '<li><i data-lucide="check-circle-2"></i> Pembayaran QRIS / Transfer</li>' +
          '<li><i data-lucide="check-circle-2"></i> Proses setelah konfirmasi</li>' +
        '</ul>';
      var priceHtml =
        '<div class="paket-price-wrap">' +
          (flash && now < normal ? '<span class="paket-old">' + VOXY.formatRp(normal) + '</span>' : '') +
          '<div class="paket-price">' + VOXY.formatRp(now) + '</div>' +
        '</div>';
      return (
        '<a class="paket-card' + (habis ? ' is-habis' : '') + (flash ? ' is-flash' : '') + '" href="detail-produk.html?id=' + encodeURIComponent(p.id) + '">' +
          badgePop +
          '<div class="paket-thumb">' +
            '<img src="' + img + '" alt="" loading="lazy" onerror="this.src=\'produk1.png\'">' +
            badgeLeft +
          '</div>' +
          '<div class="paket-body">' +
            '<h3 class="paket-title">' + (p.nama || "-") + '</h3>' +
            '<p class="paket-desc">' + desc + '</p>' +
            fitur +
            priceHtml +
            '<span class="paket-cta">' + (habis ? "Stok Habis" : "Pilih Paket") + '</span>' +
          '</div>' +
        '</a>'
      );
    }
    function renderFlash(list) {
      var flash = list.filter(isFlash);
      var box = document.getElementById("flashBox");
      var row = document.getElementById("flashRow");
      if (!flash.length) {
        box.style.display = "none";
        return;
      }
      box.style.display = "block";
      var ends = flash.map(function (p) { return Number(p.flashEnd) || 0; }).filter(function (n) { return n > 0; });
      var nearest = ends.length ? Math.min.apply(null, ends) : 0;
      function tick() {
        if (!nearest) {
          document.getElementById("flashTimer").textContent = "Aktif";
          return;
        }
        var left = nearest - Date.now();
        if (left <= 0) {
          document.getElementById("flashTimer").textContent = "00:00:00";
          return;
        }
        var h = Math.floor(left / 3600000);
        var m = Math.floor((left % 3600000) / 60000);
        var s = Math.floor((left % 60000) / 1000);
        document.getElementById("flashTimer").textContent =
          (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
      }
      tick();
      if (window._flashInterval) clearInterval(window._flashInterval);
      window._flashInterval = setInterval(tick, 1000);
      row.innerHTML = flash.map(iconCard).join("");
      lucide.createIcons();
    }
    function renderList(list) {
      var filtered = kat ? list.filter(function (p) { return matchCat(p, kat); }) : list.slice();
      document.getElementById("listCount").textContent = filtered.length + " produk";
      var grid = document.getElementById("produkGrid");
      if (!filtered.length) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">Belum ada produk di layanan ini</div>';
        renderFlash([]);
        return;
      }
      renderFlash(filtered);
      /* grid: semua produk kategori (flash juga tetap tampil dengan badge) */
      grid.innerHTML = filtered.map(iconCard).join("");
      lucide.createIcons();
    }

    VOXY.requireAuth().then(function () {
      VOXY.applyBrandingToPage();
      VOXY.getProdukList().then(function (list) {
        renderList(list || []);
      });
      VOXY.listenProduk(function (list) {
        renderList(list || []);
      });
    });
  </script>
</body>
</html>
