<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Isi Link Suntik - VOXY MARKET</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
    <style>
    .jl-wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
    .jl-card {
      background: #12182a; border: 1px solid #1e2a45;
      border-radius: 16px; padding: 20px; margin-top: 12px;
    }
    .jl-step { font-size: 12px; color: #64b5f6; font-weight: 700; margin-bottom: 8px; }
    .jl-card label {
      display: block; font-size: 13px; color: #cfd8e3; font-weight: 700; margin: 14px 0 8px;
    }
    .jl-card input {
      width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #1e2a45;
      background: #0a0e18; color: #fff; font-size: 15px; box-sizing: border-box;
    }
    .jl-btn {
      width: 100%; margin-top: 18px; padding: 15px; border: none; border-radius: 12px;
      background: #1565c0; color: #fff; font-weight: 800; font-size: 15px; cursor: pointer;
    }
    .jl-btn:disabled { opacity: 0.55; }
    .jl-kode { font-weight: 800; font-size: 20px; color: #fff; }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="logo.png" alt="VOXY MARKET" class="logo">
      <div>
        <h1>VOXY <span style="color:#1565c0">MARKET</span> <i class="fa-solid fa-circle-check verified"></i></h1>
        <p>Link target jasa suntik</p>
      </div>
    </div>
  </header>

  <div class="jl-wrap">
    <div class="jl-card">
      <div class="jl-step">KHUSUS SUNTIK · LANGKAH TERAKHIR</div>
      <div style="font-size:12px;color:#8aa0b8;">Kode order</div>
      <div class="jl-kode" id="jlKode">-</div>
      <div id="jlPaket" style="font-size:13px;color:#cfd8e3;margin-top:6px;"></div>
      <div id="jlBuktiOk" style="display:none;margin-top:10px;font-size:12px;color:#a5d6a7;">
        <i class="fa-solid fa-check-circle"></i> Bukti TF sudah ada — siap dikirim ke admin
      </div>

      <p style="font-size:13px;color:#8aa0b8;line-height:1.5;margin-top:14px;">
        Tempel <b>link target</b> (profil / post / channel). Setelah tekan konfirmasi,
        pesanan + bukti + link <b>baru masuk</b> ke panel admin dan Pesanan Saya.
      </p>

      <label><i class="fa-solid fa-link" style="color:#2196f3;"></i> Link target (wajib)</label>
      <input type="url" id="jlLink" placeholder="https://..." inputmode="url" autocomplete="off">

      <label>Catatan (opsional)</label>
      <input type="text" id="jlNote" placeholder="Misal: 1k followers">

      <button type="button" class="jl-btn" id="jlKirim" onclick="kirimLinkJasa()">
        <i class="fa-solid fa-check-circle"></i> Konfirmasi & kirim ke admin
      </button>

      <div id="jlMsg" style="display:none;margin-top:14px;padding:12px;border-radius:12px;font-size:13px;line-height:1.45;"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="global-orders.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="auth.js"></script>
  <script src="auth-guard.js"></script>
  <script src="branding.js"></script>
  <script>
    var _draft = null;
    var _kode = "";

    function loadDraft() {
      _draft = null;
      try {
        var raw = sessionStorage.getItem("voxyy_suntik_draft") || localStorage.getItem("voxyy_suntik_draft");
        if (raw) _draft = JSON.parse(raw);
      } catch (e) { _draft = null; }
      return _draft;
    }

    async function boot() {
      var p = new URLSearchParams(location.search);
      _kode = (p.get("kode") || localStorage.getItem("voxyy_saved_kode") || "").trim().toUpperCase();
      loadDraft();
      if (_draft && _draft.kode) _kode = String(_draft.kode).toUpperCase();

      document.getElementById("jlKode").textContent = _kode || "-";
      if (_draft) {
        document.getElementById("jlPaket").textContent =
          (_draft.paket || "Jasa Suntik") +
          (_draft.total ? " · " + _draft.total : "");
        if (_draft.bukti) {
          document.getElementById("jlBuktiOk").style.display = "block";
        }
      }

      if (!_kode || !_draft || !_draft.bukti) {
        var msg = document.getElementById("jlMsg");
        msg.style.display = "block";
        msg.style.background = "#3d1515";
        msg.style.color = "#ef9a9a";
        msg.innerHTML =
          "Data pembayaran suntik tidak ditemukan.<br>Silakan bayar & upload bukti TF dulu dari halaman pembayaran.";
        document.getElementById("jlKirim").disabled = true;
        return;
      }
    }

    async function kirimLinkJasa() {
      var link = (document.getElementById("jlLink").value || "").trim();
      var note = (document.getElementById("jlNote").value || "").trim();
      var btn = document.getElementById("jlKirim");
      var msg = document.getElementById("jlMsg");

      if (!link || link.length < 8) {
        alert("Isi link target yang valid.");
        return;
      }
      if (!/^https?:\/\//i.test(link)) link = "https://" + link;

      loadDraft();
      if (!_draft || !_draft.bukti) {
        alert("Draft pembayaran hilang. Ulangi dari halaman bayar.");
        location.href = "home.html";
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim ke admin...';

      var order = Object.assign({}, _draft, {
        targetLink: link,
        linkTarget: link,
        linkJasa: link,
        catatanJasa: note,
        status: "Menunggu Verifikasi",
        isJasa: true,
        _suntikDraft: false,
        updatedAt: Date.now(),
        createdAt: _draft.createdAt || Date.now(),
        waktu: _draft.waktu || new Date().toLocaleString("id-ID"),
      });
      delete order._suntikDraft;

      try {
        if (window.VoxyyOrders && window.VoxyyOrders.initFirebase) {
          try { window.VoxyyOrders.initFirebase(); } catch (e) {}
        }
        if (window.VoxyyOrders && window.VoxyyOrders.addOrder) {
          await window.VoxyyOrders.addOrder(order);
        } else {
          throw new Error("Sistem order belum siap");
        }

        // track kode untuk pesanan saya
        try {
          localStorage.setItem("voxyy_saved_kode", order.kode);
          var arr = [];
          try { arr = JSON.parse(localStorage.getItem("voxyy_saved_kodes") || "[]"); } catch (e) {}
          var up = String(order.kode).toUpperCase();
          arr = [order.kode].concat((arr || []).filter(function (x) {
            return String(x).toUpperCase() !== up;
          })).slice(0, 30);
          localStorage.setItem("voxyy_saved_kodes", JSON.stringify(arr));
          localStorage.setItem("voxyy_my_orders", JSON.stringify(arr));
        } catch (e) {}

        try { sessionStorage.removeItem("voxyy_suntik_draft"); } catch (e) {}
        try { localStorage.removeItem("voxyy_suntik_draft"); } catch (e) {}

        msg.style.display = "block";
        msg.style.background = "#0d3d1a";
        msg.style.color = "#a5d6a7";
        msg.innerHTML =
          "<b>Berhasil!</b> Pesanan + bukti + link sudah masuk panel admin.<br>Kode <b>" +
          order.kode +
          "</b>";
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Terkirim';
        setTimeout(function () {
          location.href = "antrian.html";
        }, 900);
      } catch (e) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Konfirmasi & kirim ke admin';
        alert("Gagal: " + (e.message || e));
      }
    }

    window.kirimLinkJasa = kirimLinkJasa;
    document.addEventListener("DOMContentLoaded", boot);
  </script>
  <script src="bgm.js"></script>
</body>
</html>
