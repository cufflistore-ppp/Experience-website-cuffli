<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Isi Link Suntik - VOXY MARKET</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .jl-wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
    .jl-card {
      background: #12182a; border: 1px solid #1e2a45;
      border-radius: 16px; padding: 20px; margin-top: 12px;
    }
    .jl-step { font-size: 12px; color: #64b5f6; font-weight: 700; margin-bottom: 8px; }
    .jl-card label {
      display: block; font-size: 13px; color: #cfd8e3; font-weight: 700; margin: 14px 0 8px;
    }
    .jl-card input {
      width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #1e2a45;
      background: #0a0e18; color: #fff; font-size: 15px; box-sizing: border-box;
    }
    .jl-btn {
      width: 100%; margin-top: 18px; padding: 15px; border: none; border-radius: 12px;
      background: #1565c0; color: #fff; font-weight: 800; font-size: 15px; cursor: pointer;
    }
    .jl-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .jl-kode { font-weight: 800; font-size: 20px; color: #fff; word-break: break-all; }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="logo.png" alt="VOXY MARKET" class="logo">
      <div>
        <h1>VOXY <span style="color:#1565c0">MARKET</span> <i class="fa-solid fa-circle-check verified"></i></h1>
        <p>Link target jasa suntik</p>
      </div>
    </div>
  </header>

  <div class="jl-wrap">
    <div class="jl-card">
      <div class="jl-step">KHUSUS SUNTIK · ISI LINK</div>
      <div style="font-size:12px;color:#8aa0b8;">Kode order</div>
      <div class="jl-kode" id="jlKode">Memuat...</div>
      <div id="jlPaket" style="font-size:13px;color:#cfd8e3;margin-top:6px;"></div>
      <div id="jlBuktiOk" style="display:none;margin-top:10px;font-size:12px;color:#a5d6a7;">
        <i class="fa-solid fa-check-circle"></i> Pembayaran tercatat — tempel link lalu kirim
      </div>

      <p style="font-size:13px;color:#8aa0b8;line-height:1.5;margin-top:14px;">
        Tempel <b>link target</b> (profil / post / channel), lalu konfirmasi.
      </p>

      <label><i class="fa-solid fa-link" style="color:#2196f3;"></i> Link target</label>
      <input type="url" id="jlLink" placeholder="https://..." inputmode="url" autocomplete="off">

      <button type="button" class="jl-btn" id="jlKirim" onclick="kirimLinkJasa()" disabled>
        <i class="fa-solid fa-check-circle"></i> Konfirmasi &amp; kirim ke admin
      </button>

      <div id="jlMsg" style="display:none;margin-top:14px;padding:12px;border-radius:12px;font-size:13px;line-height:1.45;"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="global-orders.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="auth.js"></script>
  <script src="auth-guard.js"></script>
  <script src="branding.js"></script>
  <script>
    var _order = null;
    var _kode = "";

    function setMsg(html, ok) {
      var msg = document.getElementById("jlMsg");
      msg.style.display = "block";
      msg.style.background = ok ? "#0d3d1a" : "#3d1515";
      msg.style.color = ok ? "#a5d6a7" : "#ef9a9a";
      msg.innerHTML = html;
    }
    function hideMsg() {
      document.getElementById("jlMsg").style.display = "none";
    }

    async function findOrder(kode) {
      var up = String(kode || "").trim().toUpperCase();
      if (!up) return null;
      try {
        if (window.VoxyyOrders && window.VoxyyOrders.initFirebase) {
          try { window.VoxyyOrders.initFirebase(); } catch (e) {}
        }
        if (window.VoxyyOrders && window.VoxyyOrders.getOrders) {
          var orders = await window.VoxyyOrders.getOrders();
          var o = (orders || []).find(function (x) {
            return String(x.kode || "").toUpperCase() === up ||
              String(x._id || "").toUpperCase() === up;
          });
          if (o) return o;
        }
      } catch (e) {}
      // localStorage fallback
      try {
        var loc = JSON.parse(localStorage.getItem("voxyy_orders") || "[]");
        return (loc || []).find(function (x) {
          return String(x.kode || "").toUpperCase() === up;
        }) || null;
      } catch (e) {
        return null;
      }
    }

    async function boot() {
      var params = new URLSearchParams(location.search);
      _kode = (params.get("kode") || localStorage.getItem("voxyy_saved_kode") || "").trim().toUpperCase();
      document.getElementById("jlKode").textContent = _kode || "-";

      if (!_kode) {
        setMsg("Kode order tidak ada di URL. Ulangi dari halaman pembayaran (konfirmasi + bukti TF).", false);
        document.getElementById("jlKirim").disabled = true;
        return;
      }

      var o = null;
      for (var i = 0; i < 10; i++) {
        o = await findOrder(_kode);
        if (o) break;
        await new Promise(function (r) { setTimeout(r, 500); });
      }

      if (!o) {
        // Tetap izinkan isi link — order akan dibuat/update saat kirim
        document.getElementById("jlPaket").textContent = "Order sedang disiapkan…";
        document.getElementById("jlBuktiOk").style.display = "block";
        document.getElementById("jlBuktiOk").innerHTML =
          '<i class="fa-solid fa-circle-info"></i> Kode <b>' + _kode +
          '</b> — tempel link lalu kirim. Sistem akan menghubungkan ke pembayaran Anda.';
        document.getElementById("jlKirim").disabled = false;
        hideMsg();
        _order = { kode: _kode, status: "Menunggu Link", isSuntik: true };
        return;
      }

      _order = o;
      document.getElementById("jlPaket").textContent =
        (o.paket || "Jasa Suntik") + (o.total ? " · " + o.total : "");
      document.getElementById("jlBuktiOk").style.display = "block";
      if (o.targetLink || o.linkTarget || o.linkJasa) {
        document.getElementById("jlLink").value = o.targetLink || o.linkTarget || o.linkJasa;
      }
      document.getElementById("jlKirim").disabled = false;
      hideMsg();
    }

    async function kirimLinkJasa() {
      var link = (document.getElementById("jlLink").value || "").trim();
      var btn = document.getElementById("jlKirim");
      if (!link || link.length < 8) {
        alert("Isi link target yang valid.");
        return;
      }
      if (!/^https?:\/\//i.test(link)) link = "https://" + link;
      if (!_kode) {
        alert("Kode order kosong");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim...';

      try {
        if (window.VoxyyOrders && window.VoxyyOrders.initFirebase) {
          try { window.VoxyyOrders.initFirebase(); } catch (e) {}
        }

        var patch = {
          targetLink: link,
          linkTarget: link,
          linkJasa: link,
          status: "Menunggu Verifikasi",
          isJasa: true,
          isSuntik: true,
          updatedAt: Date.now(),
        };
        if (_order) {
          if (_order.paket) patch.paket = _order.paket;
          if (_order.total) patch.total = _order.total;
          if (_order.finalAmount != null) patch.finalAmount = _order.finalAmount;
          if (_order.bukti && String(_order.bukti).indexOf("data:") === 0) patch.bukti = _order.bukti;
          if (_order.hasBukti) patch.hasBukti = true;
          if (_order.nama) patch.nama = _order.nama;
          if (_order.userEmail || _order.email) {
            patch.userEmail = _order.userEmail || _order.email;
            patch.email = _order.email || _order.userEmail;
          }
        }

        var res = null;
        var existing = await findOrder(_kode);
        if (existing && window.VoxyyOrders && window.VoxyyOrders.updateOrderByKode) {
          res = await window.VoxyyOrders.updateOrderByKode(_kode, patch);
        } else if (window.VoxyyOrders && window.VoxyyOrders.addOrder) {
          res = await window.VoxyyOrders.addOrder(Object.assign({
            kode: _kode,
            createdAt: Date.now(),
            waktu: new Date().toLocaleString("id-ID"),
            paket: (_order && _order.paket) || "Jasa Suntik",
          }, patch));
        } else {
          throw new Error("Sistem order belum siap. Refresh & coba lagi.");
        }
        if (res && res.ok === false) throw new Error(res.error || "gagal simpan");

        try {
          localStorage.setItem("voxyy_saved_kode", _kode);
          var arr = [];
          try { arr = JSON.parse(localStorage.getItem("voxyy_saved_kodes") || "[]"); } catch (e) {}
          var up = String(_kode).toUpperCase();
          arr = [_kode].concat((arr || []).filter(function (x) {
            return String(x).toUpperCase() !== up;
          })).slice(0, 30);
          localStorage.setItem("voxyy_saved_kodes", JSON.stringify(arr));
        } catch (e) {}

        setMsg("<b>Berhasil!</b> Link masuk panel admin.<br>Kode <b>" + _kode + "</b>", true);
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Terkirim';
        setTimeout(function () { location.href = "antrian.html"; }, 900);
      } catch (e) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Konfirmasi &amp; kirim ke admin';
        setMsg("Gagal kirim: " + (e.message || e), false);
      }
    }

    window.kirimLinkJasa = kirimLinkJasa;
    document.addEventListener("DOMContentLoaded", boot);
  </script>
  <script src="bgm.js"></script>
</body>
</html>
