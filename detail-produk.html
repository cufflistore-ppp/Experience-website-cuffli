<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Produk - VOXY MARKET</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <header class="app-header">
    <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
    <div class="logo-area"><span>Detail Produk</span></div>
    <div style="width:40px"></div>
  </header>
  <main class="page" id="detailPage"><div class="empty-state">Memuat...</div></main>
  <script src="global-orders.js"></script>
  <script>
    lucide.createIcons();
    var produkData = null;
    VOXY.requireAuth().then(function () {
      var id = new URLSearchParams(location.search).get("id");
      if (!id) {
        document.getElementById("detailPage").innerHTML = '<div class="empty-state">Produk tidak ditemukan</div>';
        return;
      }
      VOXY.getProdukList().then(function (list) {
        produkData = list.find(function (p) { return p.id === id; });
        if (!produkData) {
          document.getElementById("detailPage").innerHTML = '<div class="empty-state">Produk tidak ditemukan</div>';
          return;
        }
        var p = produkData;
        var img = p.gambar || "produk1.png";
        document.getElementById("detailPage").innerHTML =
          '<div class="detail-hero"><img src="' + img + '" onerror="this.src=\'produk1.png\'"></div>' +
          '<div class="detail-info">' +
          '<div style="font-size:12px;color:var(--muted)">' + (p.kategori || "Digital") + '</div>' +
          '<h1>' + (p.nama || "-") + '</h1>' +
          '<div class="price">' + VOXY.formatRp(p.harga) + '</div>' +
          '<p class="desc">' + (p.deskripsi || "Produk digital VOXY MARKET") + '</p>' +
          '<button class="btn" style="width:100%" onclick="beliSekarang()">Beli Sekarang</button></div>';
      });
    });
    function beliSekarang() {
      if (!produkData) return;
      sessionStorage.setItem("produkDipilih", JSON.stringify(produkData));
      window.location.href = "pembayaran.html";
    }
  </script>
</body>
</html>
