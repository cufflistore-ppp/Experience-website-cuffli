<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voxyy Joki - Selamat Datang</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #050a14;
      color: #fff;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #intro {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .intro-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 30%, rgba(33, 150, 243, 0.28), transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(13, 71, 161, 0.22), transparent 50%),
        radial-gradient(ellipse 50% 30% at 20% 70%, rgba(30, 136, 229, 0.18), transparent 45%);
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .logo-wrap {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 24px;
      z-index: 2;
    }
    .logo-ring {
      position: absolute;
      inset: -14px;
      border-radius: 28px;
      border: 2px solid rgba(33, 150, 243, 0.45);
      box-shadow: 0 0 36px rgba(33, 150, 243, 0.4);
      animation: spin 8s linear infinite;
    }
    .logo-ring::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 32px;
      border: 1px solid rgba(100, 181, 246, 0.3);
      animation: spin 12s linear infinite reverse;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      object-fit: cover;
      background: #0d1220;
      box-shadow: 0 0 40px rgba(33, 150, 243, 0.55);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 0 24px rgba(33, 150, 243, 0.7);
      margin-bottom: 6px;
      z-index: 2;
    }
    .sub {
      font-size: 11px;
      color: #90caf9;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 28px;
      z-index: 2;
    }
    .progress-wrap {
      width: 210px;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
      z-index: 2;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1565c0, #42a5f5, #90caf9);
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(66, 165, 245, 0.7);
      transition: width 0.12s linear;
    }
    .percent {
      font-size: 13px;
      color: #64b5f6;
      font-weight: 600;
      margin-bottom: 12px;
      z-index: 2;
    }
    .status {
      font-size: 12px;
      color: #90caf9;
      opacity: 0.85;
      z-index: 2;
      min-height: 18px;
    }
    .powered {
      position: absolute;
      bottom: 22px;
      font-size: 11px;
      color: #546e7a;
      z-index: 2;
    }
    .powered span { color: #64b5f6; }
  </style>
</head>
<body>
  <div id="intro">
    <div class="intro-bg"></div>
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <img src="logo.png" alt="Voxyy Joki" class="logo-img">
    </div>
    <div class="title">VOXYY JOKI</div>
    <div class="sub">Initializing Elite Service System</div>
    <div class="progress-wrap">
      <div class="progress-bar" id="bar"></div>
    </div>
    <div class="percent" id="percent">0%</div>
    <div class="status" id="status"></div>
    <div class="powered">Powered by <span>Vercel</span></div>
  </div>

  <audio id="bgMusic" loop preload="auto" playsinline>
    <source src="music.m4a" type="audio/mp4">
  </audio>

  <script>
    (function () {
      if (sessionStorage.getItem("voxyy_entered") === "1") {
        window.location.replace("home.html");
        return;
      }

      const bar = document.getElementById("bar");
      const percentEl = document.getElementById("percent");
      const statusEl = document.getElementById("status");
      const music = document.getElementById("bgMusic");
      let progress = 0;

      try {
        music.volume = 0.45;
        music.play().catch(function () {});
      } catch (e) {}

      function goHome() {
        sessionStorage.setItem("voxyy_entered", "1");
        sessionStorage.setItem("voxyy_music_playing", "1");
        sessionStorage.setItem("voxyy_music_time", "0");
        statusEl.textContent = "Memasuki...";
        window.location.replace("home.html");
      }

      const tick = setInterval(function () {
        if (progress >= 100) {
          clearInterval(tick);
          bar.style.width = "100%";
          percentEl.textContent = "100%";
          statusEl.textContent = "Selesai";
          setTimeout(goHome, 350);
          return;
        }
        progress += Math.random() * 5 + 2.5;
        if (progress > 100) progress = 100;
        bar.style.width = progress + "%";
        percentEl.textContent = Math.floor(progress) + "%";
      }, 65);
    })();
  </script>
</body>
</html>
