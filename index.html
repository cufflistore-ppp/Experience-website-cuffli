<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voxyy Joki - Selamat Datang</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #050a14;
      color: #fff;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #intro {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .intro-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 30%, rgba(33, 150, 243, 0.28), transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(13, 71, 161, 0.22), transparent 50%),
        radial-gradient(ellipse 50% 30% at 20% 70%, rgba(30, 136, 229, 0.18), transparent 45%);
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .logo-wrap {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 24px;
      z-index: 2;
    }
    .logo-ring {
      position: absolute;
      inset: -14px;
      border-radius: 28px;
      border: 2px solid rgba(33, 150, 243, 0.45);
      box-shadow: 0 0 36px rgba(33, 150, 243, 0.4);
      animation: spin 8s linear infinite;
    }
    .logo-ring::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 32px;
      border: 1px solid rgba(100, 181, 246, 0.3);
      animation: spin 12s linear infinite reverse;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      object-fit: cover;
      background: #0d1220;
      box-shadow: 0 0 40px rgba(33, 150, 243, 0.55);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 0 24px rgba(33, 150, 243, 0.7);
      margin-bottom: 6px;
      z-index: 2;
    }
    .sub {
      font-size: 11px;
      color: #90caf9;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 28px;
      z-index: 2;
    }
    .progress-wrap {
      width: 210px;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
      z-index: 2;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1565c0, #42a5f5, #90caf9);
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(66, 165, 245, 0.7);
      transition: width 0.12s linear;
    }
    .percent {
      font-size: 13px;
      color: #64b5f6;
      font-weight: 600;
      margin-bottom: 26px;
      z-index: 2;
    }
    .btn-enter {
      display: none;
      padding: 14px 40px;
      background: linear-gradient(135deg, #1976d2, #0d47a1);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 28px rgba(25, 118, 210, 0.55);
      z-index: 2;
    }
    .btn-enter.show {
      display: inline-block;
      animation: fadeUp 0.45s ease;
    }
    .btn-enter:active { transform: scale(0.96); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .powered {
      position: absolute;
      bottom: 22px;
      font-size: 11px;
      color: #546e7a;
      z-index: 2;
    }
    .powered span { color: #64b5f6; }

    /* Welcome text layer after click */
    #welcomeLayer {
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 20, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 24px;
      text-align: center;
    }
    #welcomeLayer.show {
      display: flex;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .welcome-title {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 14px;
      text-shadow: 0 0 20px rgba(33, 150, 243, 0.5);
    }
    .welcome-text {
      font-size: 16px;
      line-height: 1.6;
      color: #bbdefb;
      max-width: 320px;
      margin-bottom: 20px;
    }
    .welcome-hint {
      font-size: 12px;
      color: #64b5f6;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div id="intro">
    <div class="intro-bg"></div>
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <img src="logo.png" alt="Voxyy Joki" class="logo-img">
    </div>
    <div class="title">VOXYY JOKI</div>
    <div class="sub">Initializing Elite Service System</div>
    <div class="progress-wrap">
      <div class="progress-bar" id="bar"></div>
    </div>
    <div class="percent" id="percent">0%</div>
    <button type="button" class="btn-enter" id="btnEnter">KLIK UNTUK MASUK</button>
    <div class="powered">Powered by <span>Vercel</span></div>
  </div>

  <!-- Layer teks selamat datang (muncul setelah klik) -->
  <div id="welcomeLayer">
    <div class="welcome-title">Selamat Datang</div>
    <div class="welcome-text" id="welcomeText">
      Selamat datang di website Voxyy Joki.<br>
      Di sini kami menyiapkan berbagai jasa.
    </div>
    <div class="welcome-hint"><i class="fa-solid fa-volume-high"></i> Memutar suara...</div>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="music.m4a" type="audio/mp4">
  </audio>

  <script src="music.js"></script>
  <script>
    (function () {
      // Jika sudah pernah masuk di sesi ini → langsung ke home
      if (sessionStorage.getItem("voxyy_entered") === "1") {
        window.location.replace("home.html");
        return;
      }

      const bar = document.getElementById("bar");
      const percentEl = document.getElementById("percent");
      const btn = document.getElementById("btnEnter");
      const welcomeLayer = document.getElementById("welcomeLayer");
      let progress = 0;
      let ready = false;

      const tick = setInterval(function () {
        if (progress >= 100) {
          clearInterval(tick);
          ready = true;
          bar.style.width = "100%";
          percentEl.textContent = "100%";
          btn.classList.add("show");
          return;
        }
        progress += Math.random() * 5 + 2;
        if (progress > 100) progress = 100;
        bar.style.width = progress + "%";
        percentEl.textContent = Math.floor(progress) + "%";
      }, 70);

      function speakWelcome(done) {
        if (!window.speechSynthesis) {
          if (done) done();
          return;
        }
        const text = "Selamat datang di website Voxyy Joki. Di sini kami menyiapkan berbagai jasa.";
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "id-ID";
        u.rate = 0.95;
        u.pitch = 0.85;
        u.volume = 1;

        const voices = speechSynthesis.getVoices();
        let chosen = null;
        for (let i = 0; i < voices.length; i++) {
          const v = voices[i];
          const lang = (v.lang || "").toLowerCase();
          const name = (v.name || "").toLowerCase();
          if (lang.indexOf("id") !== -1) {
            if (name.indexOf("male") !== -1 || name.indexOf("pria") !== -1 || name.indexOf("andika") !== -1) {
              chosen = v;
              break;
            }
            if (!chosen) chosen = v;
          }
        }
        if (chosen) u.voice = chosen;

        u.onend = function () { if (done) done(); };
        u.onerror = function () { if (done) done(); };
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      }

      // Preload voices
      if (window.speechSynthesis) {
        speechSynthesis.getVoices();
        speechSynthesis.onvoiceschanged = function () {
          speechSynthesis.getVoices();
        };
      }

      btn.addEventListener("click", function () {
        if (!ready) return;
        btn.disabled = true;
        btn.textContent = "MEMASUKI...";

        // Mulai musik
        if (window.VoxyyMusic) {
          window.VoxyyMusic.enter();
        } else {
          const m = document.getElementById("bgMusic");
          if (m) {
            m.volume = 0.45;
            m.play().catch(function () {});
          }
          sessionStorage.setItem("voxyy_entered", "1");
          sessionStorage.setItem("voxyy_music_playing", "1");
        }

        // Tampilkan layer selamat datang + AI bicara
        welcomeLayer.classList.add("show");

        speakWelcome(function () {
          // Setelah AI selesai → ke home
          setTimeout(function () {
            window.location.href = "home.html";
          }, 400);
        });
      });
    })();
  </script>
</body>
</html>
