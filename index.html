<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voxyy Joki</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #050a14;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }

    /* ===== INTRO ===== */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050a14;
    }
    #intro.done { display: none; }
    .intro-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 30%, rgba(33, 150, 243, 0.28), transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(13, 71, 161, 0.22), transparent 50%),
        radial-gradient(ellipse 50% 30% at 20% 70%, rgba(30, 136, 229, 0.18), transparent 45%);
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .logo-wrap {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 24px;
      z-index: 2;
    }
    .logo-ring {
      position: absolute;
      inset: -14px;
      border-radius: 28px;
      border: 2px solid rgba(33, 150, 243, 0.45);
      box-shadow: 0 0 36px rgba(33, 150, 243, 0.4);
      animation: spin 8s linear infinite;
    }
    .logo-ring::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 32px;
      border: 1px solid rgba(100, 181, 246, 0.3);
      animation: spin 12s linear infinite reverse;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      object-fit: cover;
      background: #0d1220;
      box-shadow: 0 0 40px rgba(33, 150, 243, 0.55);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 0 24px rgba(33, 150, 243, 0.7);
      margin-bottom: 6px;
      z-index: 2;
    }
    .sub {
      font-size: 11px;
      color: #90caf9;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 28px;
      z-index: 2;
    }
    .progress-wrap {
      width: 210px;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
      z-index: 2;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1565c0, #42a5f5, #90caf9);
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(66, 165, 245, 0.7);
      transition: width 0.12s linear;
    }
    .percent {
      font-size: 13px;
      color: #64b5f6;
      font-weight: 600;
      margin-bottom: 12px;
      z-index: 2;
    }
    .status {
      font-size: 12px;
      color: #90caf9;
      opacity: 0.85;
      z-index: 2;
      min-height: 18px;
    }
    .powered {
      position: absolute;
      bottom: 22px;
      font-size: 11px;
      color: #546e7a;
      z-index: 2;
    }
    .powered span { color: #64b5f6; }

    /* ===== APP SHELL ===== */
    #app {
      display: none;
      width: 100%;
      height: 100%;
      height: 100dvh;
      position: relative;
    }
    #app.show { display: block; }

    #frame {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 64px;
      width: 100%;
      height: calc(100% - 64px);
      height: calc(100dvh - 64px);
      border: 0;
      background: #0a0e18;
    }

    .music-fab {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(13, 18, 32, 0.92);
      border: 1px solid rgba(33, 150, 243, 0.45);
      border-radius: 24px;
      padding: 4px 10px 4px 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
    }
    .music-fab button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #1976d2, #0d47a1);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .music-fab span {
      font-size: 12px;
      color: #90caf9;
      font-weight: 600;
      padding-right: 4px;
    }

    .shell-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: #0d1220;
      border-top: 1px solid #1a2740;
      display: flex;
      z-index: 9998;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .shell-nav a {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #8aa0b8;
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
    }
    .shell-nav a i { font-size: 18px; }
    .shell-nav a.active { color: #2196f3; }
  </style>
</head>
<body>
  <!-- INTRO -->
  <div id="intro">
    <div class="intro-bg"></div>
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <img src="logo.png" alt="Voxyy Joki" class="logo-img">
    </div>
    <div class="title">VOXYY JOKI</div>
    <div class="sub">Initializing Elite Service System</div>
    <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
    <div class="percent" id="percent">0%</div>
    <div class="status" id="status"></div>
    <div class="powered">Powered by <span>Vercel</span></div>
  </div>

  <!-- PERSISTENT AUDIO (never reloads) -->
  <audio id="bgMusic" loop preload="auto" playsinline>
    <source src="music.m4a" type="audio/mp4">
  </audio>

  <!-- APP SHELL -->
  <div id="app">
    <div class="music-fab">
      <button type="button" id="musicToggle" title="Pause / Play">
        <i class="fa-solid fa-pause" id="musicIcon"></i>
      </button>
      <span>Lagu</span>
    </div>

    <iframe id="frame" src="about:blank" title="Voxyy Joki" allow="autoplay"></iframe>

    <nav class="shell-nav" id="shellNav">
      <a href="#" data-page="joki.html"><i class="fa-solid fa-shield-halved"></i><span>Joki</span></a>
      <a href="#" data-page="digital.html"><i class="fa-solid fa-box"></i><span>Digital</span></a>
      <a href="#" data-page="home.html" class="active"><i class="fa-solid fa-house"></i><span>Home</span></a>
      <a href="#" data-page="antrian.html"><i class="fa-solid fa-clock"></i><span>Antrian</span></a>
      <a href="#" data-page="tentang.html"><i class="fa-solid fa-circle-info"></i><span>Tentang</span></a>
      <a href="#" data-page="akun.html"><i class="fa-solid fa-user"></i><span>Akun</span></a>
    </nav>
  </div>

  <script>
    (function () {
      const intro = document.getElementById("intro");
      const app = document.getElementById("app");
      const bar = document.getElementById("bar");
      const percentEl = document.getElementById("percent");
      const statusEl = document.getElementById("status");
      const music = document.getElementById("bgMusic");
      const icon = document.getElementById("musicIcon");
      const frame = document.getElementById("frame");
      const nav = document.getElementById("shellNav");

      music.volume = 0.45;
      music.loop = true;

      function setIcon(playing) {
        icon.className = playing ? "fa-solid fa-pause" : "fa-solid fa-play";
      }

      function playMusic() {
        return music.play().then(function () {
          sessionStorage.setItem("voxyy_music_playing", "1");
          setIcon(true);
          return true;
        }).catch(function () {
          setIcon(false);
          return false;
        });
      }

      function pauseMusic() {
        music.pause();
        sessionStorage.setItem("voxyy_music_playing", "0");
        setIcon(false);
      }

      function navigate(page) {
        if (!page) return;
        if (page.indexOf("http") === 0) {
          window.open(page, "_blank");
          return;
        }
        // keep same origin relative
        const clean = page.split("#")[0];
        frame.src = clean;
        nav.querySelectorAll("a").forEach(function (a) {
          const p = (a.getAttribute("data-page") || "").split("?")[0];
          const base = clean.split("?")[0];
          a.classList.toggle("active", base === p);
        });
      }

      function enterApp() {
        sessionStorage.setItem("voxyy_entered", "1");
        intro.classList.add("done");
        app.classList.add("show");
        navigate("home.html");
        // Langsung play lagu
        playMusic();
        setTimeout(function () { if (music.paused) playMusic(); }, 300);
        setTimeout(function () { if (music.paused) playMusic(); }, 1000);
      }

      // Sudah pernah masuk di sesi ini → skip intro
      if (sessionStorage.getItem("voxyy_entered") === "1") {
        enterApp();
        if (sessionStorage.getItem("voxyy_music_playing") === "0") {
          pauseMusic();
        }
      } else {
        // Progress bar → 100% → otomatis masuk
        let progress = 0;
        const tick = setInterval(function () {
          if (progress >= 100) {
            clearInterval(tick);
            bar.style.width = "100%";
            percentEl.textContent = "100%";
            statusEl.textContent = "Selesai";
            setTimeout(enterApp, 300);
            return;
          }
          progress += Math.random() * 5 + 2.5;
          if (progress > 100) progress = 100;
          bar.style.width = progress + "%";
          percentEl.textContent = Math.floor(progress) + "%";
        }, 65);
      }

      // Unlock autoplay: sentuhan pertama
      function unlock() {
        if (sessionStorage.getItem("voxyy_music_playing") === "0") return;
        if (!music.paused) return;
        playMusic();
      }
      document.addEventListener("touchstart", unlock, { once: true, passive: true });
      document.addEventListener("click", unlock, { once: true });

      document.getElementById("musicToggle").addEventListener("click", function (e) {
        e.stopPropagation();
        if (music.paused) playMusic();
        else pauseMusic();
      });

      music.addEventListener("ended", function () {
        music.currentTime = 0;
        if (sessionStorage.getItem("voxyy_music_playing") !== "0") {
          music.play().catch(function () {});
        }
      });
      music.addEventListener("play", function () { setIcon(true); });
      music.addEventListener("pause", function () {
        if (sessionStorage.getItem("voxyy_music_playing") === "0") setIcon(false);
      });

      nav.addEventListener("click", function (e) {
        const a = e.target.closest("a");
        if (!a) return;
        e.preventDefault();
        navigate(a.getAttribute("data-page"));
      });

      // Navigasi dari dalam iframe (link internal)
      window.addEventListener("message", function (e) {
        if (!e.data || e.data.type !== "voxyy-nav") return;
        navigate(e.data.href);
      });
    })();
  </script>
</body>
</html>
