<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk - ELZKII JOKI</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#fff7fb,#ffd8eb);font-family:Arial,sans-serif;color:#612342}.auth{width:min(420px,100%);background:#fff;border:1px solid #f5b6d5;border-radius:25px;padding:27px;box-shadow:0 18px 50px #c92c7924}.logo{display:block;width:105px;height:105px;object-fit:cover;border-radius:22px;margin:0 auto 14px}.auth h1{text-align:center;color:#df2785;margin:5px 0}.auth p{text-align:center;color:#98647e;font-size:13px;margin:0 0 22px}.tabs{display:flex;background:#fff0f7;border-radius:12px;padding:4px;margin-bottom:16px}.tabs button{flex:1;border:0;border-radius:9px;padding:11px;background:transparent;color:#a44c79;font-weight:bold}.tabs button.active{background:#e52b8b;color:white}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #edbfd6;border-radius:10px;font-size:15px;outline-color:#e52b8b}.primary,.google{width:100%;padding:14px;border:0;border-radius:11px;font-weight:bold;margin-top:14px;cursor:pointer}.primary{background:linear-gradient(90deg,#f45da9,#d91e80);color:white}.google{background:white;border:1px solid #e7c6d7;color:#5d2944}.msg{min-height:20px;text-align:center;color:#c21e6e;font-size:12px;margin-top:10px}.hidden{display:none}</style></head><body><main class="auth"><img class="logo" src="logo.jpg" alt="ELZKII JOKI"><h1>ELZKII JOKI</h1><p>Masuk untuk melanjutkan ke layanan kami</p><div class="tabs"><button id="loginTab" class="active" type="button">Login</button><button id="registerTab" type="button">Register</button></div><form id="authForm"><label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="nama@email.com"><label>Password</label><input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="Minimal 6 karakter"><button class="primary" id="submitBtn">Login</button></form><button class="google" id="googleBtn"><i class="fa-brands fa-google"></i> Lanjutkan dengan Google</button><div class="msg" id="msg" role="status"></div></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="ej-auth.js"></script><script>
let mode='login';const msg=document.getElementById('msg');function setMode(m){mode=m;document.getElementById('loginTab').classList.toggle('active',m==='login');document.getElementById('registerTab').classList.toggle('active',m==='register');document.getElementById('submitBtn').textContent=m==='login'?'Login':'Buat Akun';document.getElementById('password').autocomplete=m==='login'?'current-password':'new-password';msg.textContent=''}document.getElementById('loginTab').onclick=()=>setMode('login');document.getElementById('registerTab').onclick=()=>setMode('register');document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();msg.textContent='Memproses...';try{const email=document.getElementById('email').value.trim(),pw=document.getElementById('password').value;if(mode==='login'){const cred=await EJ.signInEmail(email,pw);if(!cred.user.emailVerified){await EJ.auth.signOut();msg.textContent='Verifikasi email terlebih dahulu melalui tautan yang dikirim ke email kamu.';return;}}else {const cred=await EJ.registerEmail(email,pw);await cred.user.sendEmailVerification();await EJ.auth.signOut();msg.textContent='Akun dibuat. Buka email untuk verifikasi, lalu login kembali.';return;}location.replace('home.html')}catch(err){msg.textContent=err.message}};document.getElementById('googleBtn').onclick=async()=>{msg.textContent='Menghubungkan ke Google...';try{await EJ.signInGoogle();location.replace('home.html')}catch(err){msg.textContent=err.message}};EJ.auth.onAuthStateChanged(u=>{if(u&&u.emailVerified)location.replace('home.html')});
</script></body></html>
