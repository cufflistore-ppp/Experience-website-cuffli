<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voxyy Joki</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #0a0e18;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #frame {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 64px;
      width: 100%;
      height: calc(100% - 64px);
      height: calc(100dvh - 64px);
      border: 0;
      background: #0a0e18;
      display: block;
    }
    .music-fab {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(13, 18, 32, 0.92);
      border: 1px solid rgba(33, 150, 243, 0.45);
      border-radius: 24px;
      padding: 4px 10px 4px 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
    }
    .music-fab button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #1976d2, #0d47a1);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .music-fab span {
      font-size: 12px;
      color: #90caf9;
      font-weight: 600;
      padding-right: 4px;
    }
    .shell-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: #0d1220;
      border-top: 1px solid #1a2740;
      display: flex;
      z-index: 9998;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .shell-nav a {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #8aa0b8;
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
    }
    .shell-nav a i { font-size: 18px; }
    .shell-nav a.active { color: #2196f3; }
  </style>
</head>
<body>
  <audio id="bgMusic" loop preload="auto" autoplay playsinline>
    <source src="music.m4a" type="audio/mp4">
  </audio>

  <div class="music-fab">
    <button type="button" id="musicToggle" title="Pause / Play">
      <i class="fa-solid fa-pause" id="musicIcon"></i>
    </button>
    <span>Lagu</span>
  </div>

  <iframe id="frame" src="home.html" title="Voxyy Joki" allow="autoplay"></iframe>

  <nav class="shell-nav" id="shellNav">
    <a href="joki.html" data-page="joki.html"><i class="fa-solid fa-shield-halved"></i><span>Joki</span></a>
    <a href="digital.html" data-page="digital.html"><i class="fa-solid fa-box"></i><span>Digital</span></a>
    <a href="home.html" data-page="home.html" class="active"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="antrian.html" data-page="antrian.html"><i class="fa-solid fa-clock"></i><span>Antrian</span></a>
    <a href="tentang.html" data-page="tentang.html"><i class="fa-solid fa-circle-info"></i><span>Tentang</span></a>
    <a href="akun.html" data-page="akun.html"><i class="fa-solid fa-user"></i><span>Akun</span></a>
  </nav>

  <script>
    (function () {
      if (sessionStorage.getItem("voxyy_entered") !== "1") {
        window.location.replace("index.html");
        return;
      }

      const music = document.getElementById("bgMusic");
      const icon = document.getElementById("musicIcon");
      const frame = document.getElementById("frame");
      const nav = document.getElementById("shellNav");

      music.volume = 0.45;
      music.loop = true;

      function setIcon(playing) {
        icon.className = playing ? "fa-solid fa-pause" : "fa-solid fa-play";
      }

      function playMusic() {
        return music.play().then(function () {
          sessionStorage.setItem("voxyy_music_playing", "1");
          setIcon(true);
          return true;
        }).catch(function () {
          setIcon(false);
          return false;
        });
      }

      function pauseMusic() {
        music.pause();
        sessionStorage.setItem("voxyy_music_playing", "0");
        setIcon(false);
      }

      if (sessionStorage.getItem("voxyy_music_playing") !== "0") {
        playMusic();
        setTimeout(function () { if (music.paused) playMusic(); }, 400);
        setTimeout(function () { if (music.paused) playMusic(); }, 1200);
      } else {
        setIcon(false);
      }

      function unlockOnce() {
        if (sessionStorage.getItem("voxyy_music_playing") === "0") return;
        if (!music.paused) return;
        playMusic();
      }
      document.addEventListener("touchstart", unlockOnce, { once: true, passive: true });
      document.addEventListener("click", unlockOnce, { once: true });

      document.getElementById("musicToggle").addEventListener("click", function (e) {
        e.stopPropagation();
        if (music.paused) playMusic();
        else pauseMusic();
      });

      music.addEventListener("ended", function () {
        music.currentTime = 0;
        if (sessionStorage.getItem("voxyy_music_playing") !== "0") {
          music.play().catch(function () {});
        }
      });
      music.addEventListener("play", function () { setIcon(true); });
      music.addEventListener("pause", function () {
        if (sessionStorage.getItem("voxyy_music_playing") === "0") setIcon(false);
      });

      function navigate(page) {
        if (!page) return;
        if (page.indexOf("http") === 0) {
          window.open(page, "_blank");
          return;
        }
        frame.src = page;
        nav.querySelectorAll("a").forEach(function (a) {
          const p = a.getAttribute("data-page") || "";
          const base = p.split("?")[0];
          const pageBase = page.split("?")[0];
          a.classList.toggle("active", pageBase === base);
        });
      }

      nav.addEventListener("click", function (e) {
        const a = e.target.closest("a");
        if (!a) return;
        e.preventDefault();
        navigate(a.getAttribute("data-page"));
      });

      window.addEventListener("message", function (e) {
        if (!e.data || e.data.type !== "voxyy-nav") return;
        navigate(e.data.href);
      });
    })();
  </script>
</body>
</html>
