<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Produk VOXY</title>

<link rel="stylesheet" href="css/admin-produk.css">

</head>


<body>


<main class="admin-main">


<header class="page-header">

<h1>
Kelola Produk
</h1>

<p>
Tambah produk VOXY MARKET
</p>

</header>





<section class="product-form">


<h2>
Tambah Produk Baru
</h2>



<div class="form-group">

<label>
Nama Produk
</label>

<input 
id="namaProduk"
type="text"
placeholder="Nama produk">

</div>





<div class="form-group">

<label>
Harga
</label>

<input 
id="hargaProduk"
type="number"
placeholder="Harga">

</div>





<div class="form-group">

<label>
Kategori
</label>

<select id="kategoriProduk">


<option>
Akun Premium
</option>


<option>
Produk Digital
</option>


<option>
Jasa Suntik
</option>


<option>
Jasa
</option>


</select>

</div>






<div class="form-group">

<label>
Tipe Pengiriman
</label>


<select id="tipeProduk">


<option value="akun">
Email + Password
</option>


<option value="file">
APK / ZIP
</option>


<option value="link">
Link
</option>


<option value="target">
Link Target
</option>


<option value="jasa">
WhatsApp Admin
</option>


</select>


</div>







<div class="form-group">

<label>
Foto Produk
</label>


<input 
type="file"
id="gambarProduk"
accept="image/*">


<img 
id="previewProduk"
class="preview-image"
src="assets/no-image.png">


</div>






<div class="form-group">

<label>
Deskripsi
</label>


<textarea
id="deskripsiProduk">
</textarea>


</div>






<button 
id="btnSimpan"
class="save-product">

Simpan Produk

</button>




</section>








<section class="product-list">


<h2>
Produk Aktif
</h2>


<div id="productContainer">

</div>


</section>





</main>





<script src="js/admin-produk.js"></script>


</body>

</html>
