<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Produk Digital - VOXY MARKET</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="market-page">

  <header class="market-header">
    <div class="market-brand">
      <div class="vx-badge">VX</div>
      <div class="market-title">VOXY <span>MARKET</span></div>
    </div>
    <a href="akun.html" class="market-user"><i class="fa-solid fa-user"></i></a>
  </header>

  <div class="top-notif" id="topNotif" style="display:none;"></div>

  <div class="market-content">
    <h1 class="market-heading">Produk Digital</h1>
    <p class="market-sub">Pilih produk digital yang ingin kamu beli.</p>

    <div class="market-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchDigital" placeholder="Cari produk..." autocomplete="off" oninput="onSearchDigital()">
    </div>

    <div class="market-cats" id="digitalCats">
      <button class="cat-chip active" data-cat="all" onclick="filterDigital('all')">Semua</button>
      <button class="cat-chip" data-cat="APK" onclick="filterDigital('APK')">Aplikasi</button>
      <button class="cat-chip" data-cat="SCRIPT" onclick="filterDigital('SCRIPT')">Script</button>
      <button class="cat-chip" data-cat="NOKOS" onclick="filterDigital('NOKOS')">Nokos</button>
      <button class="cat-chip" data-cat="MURID" onclick="filterDigital('MURID')">Lainnya</button>
    </div>

    <div class="market-grid" id="digitalList"></div>
  </div>

  <nav class="bottom-nav nav-5">
    <a href="joki.html" class="nav-item"><i class="fa-solid fa-bag-shopping"></i><span>Produk</span></a>
    <a href="digital.html" class="nav-item active"><i class="fa-solid fa-grip"></i><span>Kategori</span></a>
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="antrian.html" class="nav-item"><i class="fa-solid fa-clipboard-list"></i><span>Pesanan</span></a>
    <a href="akun.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Akun</span></a>
  </nav>

  <script src="digital-produk.js"></script>
  <script src="script.js"></script>
</body>
</html>
