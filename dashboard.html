<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — VORTEX HUB</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo"><div class="logo-icon">V</div><span>VORTEX <span class="gradient-text">HUB</span></span></a>
      <div class="nav-links"><a href="index.html">Beranda</a><a href="tools.html">Tools</a><a href="ai.html">AI</a><a href="games.html">Games</a><a href="developer.html">Developer</a></div>
      <div class="nav-actions">
        <button class="theme-toggle">🌙</button>
        <div id="nav-user-area"></div>
      </div>
    </div>
  </nav>

  <div class="page-wrapper">
    <main class="main-content">
      <div class="container">
        <h1>Dashboard</h1>
        <p class="text-muted mb-3">Selamat datang, <strong id="dash-name">User</strong> (<span id="dash-email"></span>)</p>

        <div class="dashboard-stats">
          <div class="stat-card">
            <div class="icon-box">🧰</div>
            <div><div class="value" id="stat-tools-total">0</div><div class="label">Total Tools</div></div>
          </div>
          <div class="stat-card">
            <div class="icon-box">🕐</div>
            <div><div class="value" id="stat-recent">0</div><div class="label">Recent</div></div>
          </div>
          <div class="stat-card">
            <div class="icon-box">⭐</div>
            <div><div class="value" id="stat-favs">0</div><div class="label">Favorit</div></div>
          </div>
        </div>

        <div class="section-header mt-3">
          <h2 class="section-title">🕐 Baru Digunakan</h2>
        </div>
        <div class="grid grid-4" id="recent-tools"></div>

        <div class="section-header mt-3">
          <h2 class="section-title">⭐ Favorit</h2>
        </div>
        <div class="grid grid-4" id="fav-tools"></div>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span class="nav-icon">🏠</span>Home</a>
    <a href="tools.html"><span class="nav-icon">🧰</span>Tools</a>
    <a href="ai.html"><span class="nav-icon">🤖</span>AI</a>
    <a href="games.html"><span class="nav-icon">🎮</span>Games</a>
    <a href="profile.html" class="active"><span class="nav-icon">👤</span>Profil</a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/search.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => Dashboard.init());</script>
</body>
</html>
