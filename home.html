<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOXY MARKET</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="logo-area">
      <img src="logo.png" alt="VOXY">
      <span class="badge-dot" id="logoBadge"></span>
      <span class="brand-name"><span class="brand-voxy">VOXY</span> <span class="brand-market">MARKET</span></span>
    </div>
    <div class="header-actions">
      <button type="button" class="icon-btn" id="btnMenu" aria-label="Menu" onclick="document.getElementById('drawerBg').classList.add('show');document.getElementById('sideDrawer').classList.add('show');if(window.lucide)lucide.createIcons();"><i data-lucide="menu"></i></button>
    </div>
  </header>

  <div class="side-drawer-bg" id="drawerBg" onclick="this.classList.remove('show');document.getElementById('sideDrawer').classList.remove('show');"></div>
  <div class="side-drawer" id="sideDrawer">
    <div class="side-drawer-head">
      <div class="logo-area">
        <img src="logo.png" alt="">
        <span class="brand-name"><span class="brand-voxy">VOXY</span> <span class="brand-market">MARKET</span></span>
      </div>
      <button type="button" class="icon-btn" id="btnCloseDrawer" onclick="document.getElementById('drawerBg').classList.remove('show');document.getElementById('sideDrawer').classList.remove('show');"><i data-lucide="x"></i></button>
    </div>
    <nav class="side-drawer-nav">
      <a href="akun.html"><i data-lucide="user"></i> Akun</a>
      <a href="riwayat.html"><i data-lucide="receipt"></i> Transaksi</a>
      <a href="home.html"><i data-lucide="package"></i> Semua Produk</a>
      <a href="chat.html"><i data-lucide="message-circle"></i> Bantuan Admin</a>
    </nav>
  </div>

  <main class="page home-page">
    <div class="banner-wrap">
      <div class="banner-track" id="bannerTrack">
        <img src="banner.png" alt="1">
        <img src="banner2.png" alt="2">
        <img src="banner3.png" alt="3">
      </div>
      <div class="banner-dots" id="bannerDots"><span class="active"></span><span></span><span></span></div>
    </div>

    <a href="search.html" class="home-search">
      <i data-lucide="search" style="width:18px;height:18px"></i>
      <span>Cari produk atau layanan...</span>
    </a>

    <section class="menu-layanan-section" id="menuLayananSection">
      <h2 class="menu-layanan-title">MENU LAYANAN</h2>
      <div class="menu-layanan-grid" id="menuLayananGrid">
        <div class="empty-state" style="grid-column:1/-1;padding:16px;font-size:12px">Memuat menu...</div>
      </div>
    </section>

    <footer class="home-mini-footer">
      <p>VOXY MARKET · Produk digital &amp; jasa</p>
      <div class="home-mini-links">
        <a href="riwayat.html">Pesanan</a>
        <a href="chat.html">Bantuan</a>
        <a href="akun.html">Akun</a>
      </div>
      <p class="home-mini-copy">&copy; 2026 VOXY MARKET</p>
    </footer>
  </main>

  <div class="fab-chat" id="fabChat" title="Chat Admin">
    <img src="chat-admin.png" alt="Chat">
    <span class="badge-dot" id="fabBadge"></span>
  </div>

  <div class="laporan-sheet" id="laporanSheet">
    <div class="laporan-panel">
      <h3>Chat Admin</h3>
      <p>Pilih cara menghubungi admin</p>
      <div class="laporan-options">
        <button type="button" class="btn" id="btnChatWeb">Chat via Website</button>
        <button type="button" class="btn btn-wa" id="btnChatWA">Chat via WhatsApp</button>
        <button type="button" class="btn btn-outline" id="btnChatBatal">Batal</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="active"><i data-lucide="home"></i>Home</a>
    <a href="riwayat.html"><i data-lucide="receipt"></i>Transaksi</a>
    <a href="akun.html"><i data-lucide="user"></i>Akun</a>
  </nav>

  <script src="global-orders.js"></script>
  <script>
    lucide.createIcons();

    /* Drawer */
    (function () {
      var bg = document.getElementById("drawerBg");
      var dr = document.getElementById("sideDrawer");
      var btn = document.getElementById("btnMenu");
      var closeBtn = document.getElementById("btnCloseDrawer");
      if (!bg || !dr || !btn) return;
      function openD(e) { if (e) e.preventDefault(); bg.classList.add("show"); dr.classList.add("show"); if (window.lucide) lucide.createIcons(); }
      function closeD(e) { if (e) e.preventDefault(); bg.classList.remove("show"); dr.classList.remove("show"); }
      btn.addEventListener("click", openD);
      if (closeBtn) closeBtn.addEventListener("click", closeD);
      bg.addEventListener("click", closeD);
    })();

    var waAdmin = "";
    var bi = 0;
    function startBanner() {
      setInterval(function () {
        bi = (bi + 1) % 3;
        var track = document.getElementById("bannerTrack");
        if (track) track.style.transform = "translateX(-" + (bi * 100) + "%)";
        document.querySelectorAll("#bannerDots span").forEach(function (d, i) {
          d.classList.toggle("active", i === bi);
        });
      }, 3500);
    }

    function bukaLaporan() { document.getElementById("laporanSheet").classList.add("show"); }
    function tutupLaporan() { document.getElementById("laporanSheet").classList.remove("show"); }
    document.getElementById("laporanSheet").addEventListener("click", function (e) {
      if (e.target === this) tutupLaporan();
    });
    document.getElementById("btnChatWeb").onclick = function () { location.href = "chat.html"; };
    document.getElementById("btnChatWA").onclick = function () {
      VOXY.bukaWhatsApp(waAdmin, "Halo admin VOXY MARKET, saya mau tanya/lapor:");
      tutupLaporan();
    };
    document.getElementById("btnChatBatal").onclick = tutupLaporan;

    (function () {
      var fab = document.getElementById("fabChat");
      var y = window.innerHeight - 160;
      var dragging = false, moved = false, sy, oy;
      function place() {
        fab.style.right = "14px";
        fab.style.left = "auto";
        fab.style.top = y + "px";
        fab.style.bottom = "auto";
      }
      place();
      function onStart(e) {
        dragging = true; moved = false;
        var t = e.touches ? e.touches[0] : e;
        sy = t.clientY; oy = y;
        e.preventDefault();
      }
      function onMove(e) {
        if (!dragging) return;
        var t = e.touches ? e.touches[0] : e;
        var dy = t.clientY - sy;
        if (Math.abs(dy) > 6) moved = true;
        y = Math.max(56, Math.min(window.innerHeight - 80, oy + dy));
        place();
      }
      function onEnd() {
        if (!dragging) return;
        dragging = false;
        fab.classList.remove("dragging");
        if (!moved) bukaLaporan();
      }
      fab.addEventListener("mousedown", onStart);
      fab.addEventListener("touchstart", onStart, { passive: false });
      window.addEventListener("mousemove", onMove);
      window.addEventListener("touchmove", onMove, { passive: false });
      window.addEventListener("mouseup", onEnd);
      window.addEventListener("touchend", onEnd);
    })();

    function renderMenuLayanan(menus) {
      var grid = document.getElementById("menuLayananGrid");
      if (!grid) return;
      var list = (menus || []).filter(function (m) {
        return m.aktif !== false && m.aktif !== "false";
      }).sort(function (a, b) {
        return (Number(a.urutan) || 0) - (Number(b.urutan) || 0);
      });
      if (!list.length) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;padding:16px;font-size:12px;color:var(--muted)">Belum ada menu layanan.<br>Admin: Panel Admin → Menu Layanan</div>';
        return;
      }
      grid.innerHTML = list.map(function (m) {
        var icon = (m.icon || "package").replace(/[^a-z0-9-]/gi, "") || "package";
        var judul = (m.judul || "Layanan").replace(/</g, "&lt;");
        var sub = (m.subjudul || "").replace(/</g, "&lt;");
        var kat = (m.kategori || "").replace(/"/g, "");
        var judulQ = encodeURIComponent(m.judul || kat || "Layanan");
        var katQ = encodeURIComponent(kat);
        var href = "layanan.html?kat=" + katQ + "&judul=" + judulQ;
        return (
          '<a class="menu-layanan-btn" href="' + href + '">' +
            '<span class="mlb-icon"><i data-lucide="' + icon + '"></i></span>' +
            '<span class="mlb-text">' +
              '<span class="mlb-title">' + judul + '</span>' +
              (sub ? '<span class="mlb-sub">' + sub + '</span>' : '') +
            '</span>' +
            '<span class="mlb-arrow"><i data-lucide="chevron-right"></i></span>' +
          '</a>'
        );
      }).join("");
      lucide.createIcons();
    }

    if (VOXY.auth) {
      VOXY.auth.onAuthStateChanged(function (user) {
        if (!user) { location.href = "login.html"; return; }
        VOXY.applyBrandingToPage();
        startBanner();
        VOXY.getSettings().then(function (s) { waAdmin = (s && s.waAdmin) || ""; });
        VOXY.getMenuLayanan().then(function (menus) {
          renderMenuLayanan(menus || []);
        }).catch(function () { renderMenuLayanan([]); });
        VOXY.listenMenuLayanan(function (menus) {
          renderMenuLayanan(menus || []);
        });
        VOXY.listenUserUnread(user.uid, function (unread) {
          ["logoBadge", "fabBadge"].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.classList.toggle("show", !!unread);
          });
        });
      });
    }
  </script>
</body>
</html>
