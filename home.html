<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOXY MARKET</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="logo-area">
      <img src="logo.png" alt="VOXY">
      <span class="badge-dot" id="logoBadge"></span>
      <span>VOXY</span>
    </div>
    <a href="search.html" class="search-pill">
      <i data-lucide="search" style="width:16px;height:16px"></i>
      Cari produk...
    </a>
    <div class="header-actions">
      <a href="chat.html" class="icon-btn" title="Chat">
        <i data-lucide="message-circle"></i>
        <span class="badge-dot" id="chatBadge"></span>
      </a>
      <a href="akun.html" class="icon-btn"><i data-lucide="user"></i></a>
    </div>
  </header>

  <main class="page">
    <div class="banner-slider">
      <img src="banner.png" alt="Banner" id="bannerImg">
    </div>
    <div class="section-title"><span>Produk Digital</span></div>
    <div class="product-grid" id="produkGrid">
      <div class="empty-state" style="grid-column:1/-1">Memuat produk...</div>
    </div>
  </main>

  <!-- FAB Laporan / Chat -->
  <div class="fab-chat" id="fabChat" onclick="bukaLaporanSheet()" title="Laporan / Chat">
    <img src="chat-admin.png" alt="Chat" onerror="this.style.display='none'">
    <span class="badge-dot" id="fabBadge"></span>
  </div>

  <!-- Bottom sheet pilih cara laporan -->
  <div class="laporan-sheet" id="laporanSheet" onclick="if(event.target===this)tutupLaporanSheet()">
    <div class="laporan-panel">
      <h3>Kirim Laporan / Tanya</h3>
      <p>Pilih cara menghubungi admin</p>
      <div class="laporan-options">
        <button class="btn" onclick="location.href='chat.html'">💬 Chat via Website</button>
        <button class="btn btn-wa" onclick="laporWA()">📱 Chat via WhatsApp</button>
        <button class="btn btn-outline" onclick="tutupLaporanSheet()">Batal</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="active"><i data-lucide="home"></i>Home</a>
    <a href="search.html"><i data-lucide="search"></i>Cari</a>
    <a href="riwayat.html"><i data-lucide="clock"></i>Riwayat</a>
    <a href="akun.html"><i data-lucide="user"></i>Akun</a>
  </nav>

  <script src="global-orders.js"></script>
  <script>
    lucide.createIcons();
    var waAdmin = "";

    VOXY.requireAuth().then(function (user) {
      loadProduk();
      startBanner();
      VOXY.getSettings().then(function (s) {
        waAdmin = (s && s.waAdmin) || "";
      });
      // Badge merah kalau admin sudah balas
      VOXY.listenUserUnread(user.uid, function (unread) {
        var show = !!unread;
        ["logoBadge", "chatBadge", "fabBadge"].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.classList.toggle("show", show);
        });
      });
    });

    var banners = ["banner.png", "banner2.png", "banner3.png"];
    var bi = 0;
    function startBanner() {
      setInterval(function () {
        bi = (bi + 1) % banners.length;
        var img = document.getElementById("bannerImg");
        if (img) img.src = banners[bi];
      }, 4000);
    }

    function loadProduk() {
      VOXY.listenProduk(function (list) {
        var grid = document.getElementById("produkGrid");
        if (!list || !list.length) {
          grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">Belum ada produk. Admin belum menambahkan.</div>';
          return;
        }
        grid.innerHTML = list.map(function (p) {
          var img = p.gambar || "produk1.png";
          return '<a class="product-card" href="detail-produk.html?id=' + encodeURIComponent(p.id) + '">' +
            '<div class="thumb"><img src="' + img + '" alt="" onerror="this.src=\'produk1.png\'"></div>' +
            '<div class="body"><div class="cat">' + (p.kategori || "Digital") + '</div>' +
            '<h3>' + (p.nama || "-") + '</h3>' +
            '<div class="price">' + VOXY.formatRp(p.harga) + '</div></div></a>';
        }).join("");
      });
    }

    function bukaLaporanSheet() {
      document.getElementById("laporanSheet").classList.add("show");
    }
    function tutupLaporanSheet() {
      document.getElementById("laporanSheet").classList.remove("show");
    }
    function laporWA() {
      VOXY.bukaWhatsApp(waAdmin, "Halo admin VOXY MARKET, saya mau tanya/lapor:");
      tutupLaporanSheet();
    }
  </script>
</body>
</html>
