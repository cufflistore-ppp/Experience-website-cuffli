<!DOCTYPE html>
<html lang="id">
<head>
  <script src="auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VOXY MARKET</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="market-page">

  <header class="market-header">
    <div class="market-brand">
      <img src="logo.png" alt="Logo" class="logo brand-logo">
      <div class="market-title">VOXY <span>MARKET</span> <i class="fa-solid fa-circle-check verified"></i></div>
    </div>
    <a href="akun.html" class="market-user" title="Profil Akun"><i class="fa-solid fa-circle-user"></i></a>
  </header>

  <div class="banner" style="margin:0;border-radius:0;">
    <img src="banner.jpg" alt="Banner" class="banner-full" style="width:100%;max-height:140px;object-fit:cover;display:block;">
  </div>
  <div class="top-notif" id="topNotif" style="display:none;"></div>

  <div class="market-content">
    <h1 class="market-heading" style="font-size:18px;margin-bottom:4px;">Cari Produk</h1>
    <p class="market-sub">Ketik nama produk yang kamu cari.</p>

    <div class="market-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchHome" placeholder="Cari produk..." autocomplete="off" oninput="onSearchHome()">
    </div>

    <div class="market-cats" id="homeCats">
      <button class="cat-chip active" data-cat="all" onclick="filterHome('all')">Semua</button>
      <button class="cat-chip" data-cat="digital" onclick="filterHome('digital')">Digital</button>
      <button class="cat-chip" data-cat="apk" onclick="filterHome('apk')">Aplikasi</button>
      <button class="cat-chip" data-cat="jasa" onclick="filterHome('jasa')">Jasa</button>
      <button class="cat-chip" data-cat="lainnya" onclick="filterHome('lainnya')">Lainnya</button>
    </div>

    <div class="menu-grid" style="margin:14px 0 18px;grid-template-columns:repeat(4,1fr);gap:10px;">
      <a href="digital.html" class="menu-item"><i class="fa-solid fa-bag-shopping"></i><span>Produk</span></a>
      <a href="kategori.html" class="menu-item"><i class="fa-solid fa-grip"></i><span>Kategori</span></a>
      <a href="antrian.html" class="menu-item"><i class="fa-solid fa-clipboard-list"></i><span>Pesanan</span></a>
      <a href="akun.html" class="menu-item"><i class="fa-solid fa-circle-user"></i><span>Akun</span></a>
    </div>

    <h3 style="font-size:14px;margin:0 0 10px;color:#cfd8e3;">Produk</h3>
    <div class="market-grid" id="homeGrid"></div>
  </div>

  <nav class="bottom-nav nav-5">
    <a href="digital.html" class="nav-item"><i class="fa-solid fa-bag-shopping"></i><span>Produk</span></a>
    <a href="kategori.html" class="nav-item"><i class="fa-solid fa-grip"></i><span>Kategori</span></a>
    <a href="home.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="antrian.html" class="nav-item"><i class="fa-solid fa-clipboard-list"></i><span>Pesanan</span></a>
    <a href="akun.html" class="nav-item"><i class="fa-solid fa-circle-user"></i><span>Akun</span></a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="global-orders.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="auth.js"></script>
  <script src="branding.js"></script>
  <script src="katalog.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      renderKatalog("homeGrid", "home");
    });
  </script>
</body>
</html>
