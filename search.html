<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cari - VOXY MARKET</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <header class="app-header">
    <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
    <div class="logo-area"><span>Cari Produk</span></div>
    <div style="width:40px"></div>
  </header>
  <main class="page search-page">
    <div class="search-bar"><input id="q" type="search" placeholder="Cari nama / kategori..." autofocus></div>
    <div class="product-grid" id="hasil"><div class="empty-state" style="grid-column:1/-1">Ketik untuk mencari</div></div>
  </main>
  <nav class="bottom-nav">
    <a href="home.html"><i data-lucide="home"></i>Home</a>
    <a href="search.html" class="active"><i data-lucide="search"></i>Cari</a>
    <a href="riwayat.html"><i data-lucide="clock"></i>Riwayat</a>
    <a href="akun.html"><i data-lucide="user"></i>Akun</a>
  </nav>
  <script src="global-orders.js"></script>
  <script>
    lucide.createIcons();
    var allProduk = [];
    VOXY.requireAuth().then(function () {
      VOXY.getProdukList().then(function (list) { allProduk = list || []; });
    });
    document.getElementById("q").addEventListener("input", function () {
      var q = this.value.trim().toLowerCase();
      var grid = document.getElementById("hasil");
      if (!q) { grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">Ketik untuk mencari</div>'; return; }
      var filtered = allProduk.filter(function (p) {
        return (p.nama || "").toLowerCase().indexOf(q) !== -1 ||
               (p.kategori || "").toLowerCase().indexOf(q) !== -1 ||
               (p.deskripsi || "").toLowerCase().indexOf(q) !== -1;
      });
      if (!filtered.length) { grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">Tidak ditemukan</div>'; return; }
      grid.innerHTML = filtered.map(function (p) {
        var img = p.gambar || "produk1.png";
        return '<a class="product-card" href="detail-produk.html?id=' + encodeURIComponent(p.id) + '">' +
          '<div class="thumb"><img src="' + img + '" onerror="this.src=\'produk1.png\'"></div>' +
          '<div class="body"><div class="cat">' + (p.kategori || "Digital") + '</div>' +
          '<h3>' + (p.nama || "-") + '</h3><div class="price">' + VOXY.formatRp(p.harga) + '</div></div></a>';
      }).join("");
    });
  </script>
</body>
</html>
