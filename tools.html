<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semua Tools — VORTEX HUB</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo"><div class="logo-icon">V</div><span>VORTEX <span class="gradient-text">HUB</span></span></a>
      <div class="nav-links">
        <a href="index.html">Beranda</a>
        <a href="tools.html" class="active">Tools</a>
        <a href="ai.html">AI</a>
        <a href="games.html">Games</a>
        <a href="developer.html">Developer</a>
      </div>
      <div class="nav-actions">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Cari tools..." autocomplete="off">
          <div class="search-results"></div>
        </div>
        <button class="theme-toggle">🌙</button>
        <button class="btn-icon menu-toggle" onclick="Search.openMobile()">🔍</button>
        <div id="nav-user-area"></div>
      </div>
    </div>
  </nav>

  <div class="mobile-search-overlay">
    <div class="mobile-search-header">
      <input type="text" placeholder="Cari tools...">
      <button class="btn btn-secondary btn-sm" onclick="Search.closeMobile()">Tutup</button>
    </div>
    <div id="mobile-search-results"></div>
  </div>

  <div class="page-wrapper">
    <main class="main-content">
      <div class="container">
        <div class="section-header">
          <h1 class="section-title"><span class="icon">🧰</span> Semua Tools</h1>
        </div>

        <div class="category-pills" id="category-pills">
          <button class="pill active" data-cat="all">Semua</button>
          <button class="pill" data-cat="calculator">Kalkulator</button>
          <button class="pill" data-cat="converter">Converter</button>
          <button class="pill" data-cat="text">Text</button>
          <button class="pill" data-cat="image">Image</button>
          <button class="pill" data-cat="ai">AI</button>
          <button class="pill" data-cat="developer">Developer</button>
          <button class="pill" data-cat="finance">Finance</button>
          <button class="pill" data-cat="education">Education</button>
          <button class="pill" data-cat="games">Games</button>
        </div>

        <div class="grid grid-4" id="tools-grid"></div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">© 2026 VORTEX HUB</div>
      </div>
    </footer>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span class="nav-icon">🏠</span>Home</a>
    <a href="tools.html" class="active"><span class="nav-icon">🧰</span>Tools</a>
    <a href="ai.html"><span class="nav-icon">🤖</span>AI</a>
    <a href="games.html"><span class="nav-icon">🎮</span>Games</a>
    <a href="profile.html"><span class="nav-icon">👤</span>Profil</a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/search.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderTools(cat = 'all') {
      const list = cat === 'all' ? ToolsRegistry : getToolsByCategory(cat);
      const grid = document.getElementById('tools-grid');
      grid.innerHTML = list.map(t => `
        <a href="${t.page}" class="card tool-card" onclick="useTool('${t.id}')">
          <div class="tool-icon">${t.icon}</div>
          <h4>${t.name}</h4>
          <p>${t.desc}</p>
        </a>
      `).join('');
    }

    document.querySelectorAll('#category-pills .pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('#category-pills .pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        renderTools(pill.dataset.cat);
      });
    });

    renderTools();
  </script>
</body>
</html>
