<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VOXY MARKET</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <img src="logo.png" alt="VOXY">
      <h1>VOXY MARKET</h1>
      <p class="sub">Login untuk melanjutkan</p>
      <input id="email" type="email" placeholder="Email" autocomplete="email">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn" id="btnLogin" onclick="doLogin()">LOGIN</button>
      <div class="divider">atau</div>
      <button class="btn-google" onclick="doGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.3 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.3 29.4 4 24 4 16.3 4 9.5 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.3 35.5 26.8 36 24 36c-5.3 0-9.7-3.3-11.3-8H6.3C9.5 39.7 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.3 4.1-4.1 5.4l6.2 5.2C40.3 35.2 44 30 44 24c0-1.3-.1-2.5-.4-3.5z"/></svg>
        Login Google
      </button>
      <p class="auth-footer">Belum punya akun? <a href="daftar.html">Daftar</a></p>
    </div>
  </div>
  <script src="global-orders.js"></script>
  <script>
    firebase.auth().onAuthStateChanged(function (user) {
      if (user) {
        window.location.href = VOXY.isAdmin(user.email) ? "admin.html" : "home.html";
      }
    });
    function doLogin() {
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;
      if (!email || !password) { alert("Isi email dan password"); return; }
      var btn = document.getElementById("btnLogin");
      btn.disabled = true; btn.textContent = "Loading...";
      VOXY.loginUser(email, password).then(function (cred) {
        window.location.href = VOXY.isAdmin(cred.user.email) ? "admin.html" : "home.html";
      }).catch(function (err) {
        alert(err.message || "Login gagal");
        btn.disabled = false; btn.textContent = "LOGIN";
      });
    }
    function doGoogleLogin() {
      var provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider).then(function (result) {
        window.location.href = VOXY.isAdmin(result.user.email) ? "admin.html" : "home.html";
      }).catch(function (err) {
        if (err.code !== "auth/popup-closed-by-user") alert(err.message || "Google login gagal");
      });
    }
    document.getElementById("password").addEventListener("keydown", function (e) {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
