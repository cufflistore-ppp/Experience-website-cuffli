<!DOCTYPE html>
<html lang="id">
<head>
  <script src="iframe-nav.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Doxy Joki</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 48px;
    }
    .admin-header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }
    .admin-hamburger {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: rgba(0,0,0,0.18);
      color: #0a0e18;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .admin-hamburger:hover { background: rgba(0,0,0,0.28); }
    .admin-menu-panel {
      display: none;
      position: absolute;
      left: 12px;
      top: calc(100% + 6px);
      z-index: 200;
      min-width: 210px;
      background: #10182a;
      border: 1px solid #1a2740;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      overflow: hidden;
    }
    .admin-menu-panel.open { display: block; }
    .admin-menu-panel a,
    .admin-menu-panel button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      background: transparent;
      border: none;
      border-bottom: 1px solid #1a2740;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
    }
    .admin-menu-panel a:last-child,
    .admin-menu-panel button:last-child { border-bottom: none; }
    .admin-menu-panel a:hover,
    .admin-menu-panel button:hover { background: #152038; color: #64b5f6; }
    .admin-status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
    }
    .status-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 2px solid transparent;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }
    .status-toggle.online {
      background: rgba(0, 170, 0, 0.15);
      border-color: #00aa00;
      color: #00e676;
    }
    .status-toggle.offline {
      background: rgba(198, 40, 40, 0.18);
      border-color: #c62828;
      color: #ff5252;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }
    .status-toggle.online .status-dot { animation: pulse-online 1.5s infinite; }
    @keyframes pulse-online {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }
    .admin-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .admin-tab {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #1a2740;
      background: #10182a;
      color: #aaa;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .admin-tab.active {
      background: #2196f3;
      color: #0a0e18;
      border-color: #2196f3;
    }
    .produk-admin-card {
      background: #10182a;
      border: 1px solid #1a2740;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .produk-admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .produk-admin-actions button {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-edit { background: #2196f3; color: #fff; }
    .btn-del { background: #333; color: #ff6666; }
    .btn-add-produk {
      background: linear-gradient(90deg, #2196f3, #1565c0);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .form-produk-edit {
      background: #0d1220;
      border: 1px solid #1a2740;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .form-produk-edit.show { display: block; }
    .form-produk-edit label {
      display: block;
      font-size: 12px;
      color: #90caf9;
      margin: 8px 0 4px;
    }
    .form-produk-edit input,
    .form-produk-edit select,
    .form-produk-edit textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #1a2740;
      background: #10182a;
      color: #fff;
      font-size: 14px;
    }
    .form-produk-edit .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="admin-header">
    <button type="button" class="admin-hamburger" id="adminHamburger" aria-label="Menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="admin-menu-panel" id="adminMenuPanel">
      <a href="home.html"><i class="fa-solid fa-house"></i> Kembali ke Home</a>
      <a href="edit-produk.html"><i class="fa-solid fa-box-open"></i> Edit Produk</a>
      <button type="button" id="menuTransaksi"><i class="fa-solid fa-receipt"></i> Transaksi</button>
    </div>
    <div class="admin-header-title">
      <i class="fa-solid fa-user-shield"></i> PANEL ADMIN - DOXY JOKI
    </div>
    <div class="admin-status-bar">
      <span id="statusToggle" class="status-toggle online" role="button" tabindex="0" title="Klik untuk ubah status maintenance">
        <span class="status-dot"></span>
        <span id="statusLabel">ONLINE</span>
      </span>
      <small id="statusHint" style="opacity:0.85;font-weight:500;">(Maintenance OFF)</small>
    </div>
  </div>

  <div class="page-content">
    <div id="sectionPesanan">
      <h3 style="margin-bottom:12px;color:#2196f3;"><i class="fa-solid fa-cart-plus"></i> Tambah Pesanan Manual</h3>
      
      <div class="form-section">
        <label>Kode Antrian</label>
        <input type="text" id="admKode" placeholder="DJ-2026-XXXX (kosongkan = auto)">
        
        <label>Nama</label>
        <input type="text" id="admNama" placeholder="Nama customer">
        
        <label>WhatsApp</label>
        <input type="text" id="admWA" placeholder="08xxxxxxxxxx">
        
        <label>Total</label>
        <input type="text" id="admTotal" placeholder="Rp 5.000">
        
        <label>Status</label>
        <select id="admStatus">
          <option value="Belum Bayar">Belum Bayar</option>
          <option value="Proses">Proses</option>
          <option value="Sukses">Sukses</option>
        </select>
        
        <button class="btn-buat" style="margin-top:12px;" onclick="tambahOrderAdmin()">
          <i class="fa-solid fa-plus"></i> Tambah Pesanan
        </button>
      </div>

      <h3 style="margin:24px 0 12px;color:#2196f3;"><i class="fa-solid fa-list"></i> Daftar Pesanan</h3>
      <div id="listOrders"></div>
    </div>

    </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="global-orders.js"></script>
  <script src="produk.js"></script>
  <script src="digital-produk.js"></script>
  <script src="script.js"></script>
  <script src="admin.js"></script>
</body>
</html>
