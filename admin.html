<!DOCTYPE html>
<html lang="id">
<head>
  <script src="iframe-nav.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - ELZKII JOKI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-header">
    <i class="fa-solid fa-user-shield"></i> PANEL ADMIN - ELZKII JOKI
  </div>

  <div class="page-content">
    <h3 style="margin-bottom:12px;color:#2196f3;">Tambah Pesanan Manual</h3>
    
    <div class="form-section">
      <label>Kode Antrian</label>
      <input type="text" id="admKode" placeholder="EJ-2026-XXXX (kosongkan = auto)">
      
      <label>Nama</label>
      <input type="text" id="admNama" placeholder="Nama customer">
      
      <label>WhatsApp</label>
      <input type="text" id="admWA" placeholder="08xxxxxxxxxx">
      
      <label>Total</label>
      <input type="text" id="admTotal" placeholder="Rp 5.000">
      
      <label>Status</label>
      <select id="admStatus">
        <option value="Belum Bayar">Belum Bayar</option>
        <option value="Proses">Proses</option>
        <option value="Sukses">Sukses</option>
      </select>
      
      <button class="btn-buat" style="margin-top:12px;" onclick="tambahOrderAdmin()">
        <i class="fa-solid fa-plus"></i> Tambah Pesanan
      </button>
    </div>

    <h3 style="margin:24px 0 12px;color:#2196f3;">Daftar Pesanan</h3>
    <div id="listOrders"></div>
  </div>


  <div class="page-content"><h3 style="color:#d91d80;margin:8px 0 12px">Kelola Produk Home</h3><div class="form-section"><label>Nama Produk</label><input id="ejProdName" placeholder="Nama produk"><label>Harga (angka)</label><input id="ejProdPrice" type="number" min="0" placeholder="5000"><label>URL / nama file gambar (opsional)</label><input id="ejProdImg" placeholder="logo-produk.jpg"><label>Isi produk / kode (opsional)</label><textarea id="ejProdDelivery" placeholder="Teks atau kode produk yang akan diberikan buyer"></textarea><label>Kategori</label><select id="ejProdType"><option value="digital">Produk Digital</option><option value="joki">Jasa Joki</option></select><button class="btn-buat" type="button" onclick="ejAddProduct()">Tambah Produk ke Katalog</button><div id="ejProdList" style="margin-top:12px"></div></div><p style="font-size:12px;color:#98647f">Produk disimpan di Firebase dan tampil pada katalog buyer setelah login.</p></div>
  <div class="page-content"><h3 style="color:#d91d80;margin:8px 0 12px">Kirim Produk ke Buyer</h3><div class="form-section"><label>Email akun buyer</label><input id="ejDeliveryEmail" type="email" placeholder="email buyer yang sudah login"><label>Judul pengiriman</label><input id="ejDeliveryTitle" placeholder="Contoh: Produk Premium"><label>Link download (opsional)</label><input id="ejDeliveryLink" type="url" placeholder="https://..."><label>Teks / kode produk (opsional)</label><textarea id="ejDeliveryNote" placeholder="Tuliskan produk digital atau instruksi untuk buyer"></textarea><button class="btn-buat" type="button" onclick="ejSendDelivery()">Kirim ke Buyer</button></div><p style="font-size:12px;color:#98647f">Buyer harus pernah login menggunakan email tersebut agar UID akunnya dapat ditemukan.</p></div>
  <script src="produk-admin.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="global-orders.js"></script>
  <script src="telegram.js"></script>
  <script src="script.js"></script>
  <script src="admin.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="ej-auth.js"></script>
</body>
</html>
