<div class="login-box">

<h1>
Buat Akun
</h1>


<input id="email"
placeholder="Email">


<input id="password"
type="password"
placeholder="Password">



<button onclick="register()">

DAFTAR

</button>



<p>
Sudah punya akun?

<a href="login.html">
Login
</a>

</p>


</div>



<script>


function register(){


let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



daftarUser(
email,
password
)

.then(()=>{


alert(
"Akun berhasil dibuat"
);


location.href="login.html";


})


.catch(e=>{


alert(e.message);


});


}


</script>
