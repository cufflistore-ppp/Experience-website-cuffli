<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Transaksi - VOXY MARKET</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <header class="app-header">
    <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
    <div class="logo-area"><span>Detail Transaksi</span></div>
    <div style="width:40px"></div>
  </header>
  <main class="page" id="content"><div class="empty-state">Memuat...</div></main>
  <script src="global-orders.js"></script>
  <script>
    lucide.createIcons();
    function statusClass(s) {
      s = (s || "").toLowerCase();
      if (s.indexOf("menunggu") !== -1) return "menunggu";
      if (s.indexOf("proses") !== -1) return "diproses";
      if (s.indexOf("selesai") !== -1) return "selesai";
      if (s.indexOf("tolak") !== -1) return "ditolak";
      return "menunggu";
    }
    VOXY.requireAuth().then(function (user) {
      var kode = new URLSearchParams(location.search).get("kode");
      if (!kode) {
        document.getElementById("content").innerHTML = '<div class="empty-state">Kode tidak ditemukan</div>';
        return;
      }
      VOXY.getOrder(kode).then(function (o) {
        if (!o) {
          document.getElementById("content").innerHTML = '<div class="empty-state">Pesanan tidak ditemukan</div>';
          return;
        }
        if (o.email !== user.email && o.uid !== user.uid && !VOXY.isAdmin(user.email)) {
          document.getElementById("content").innerHTML = '<div class="empty-state">Akses ditolak</div>';
          return;
        }
        document.getElementById("content").innerHTML =
          '<div class="pay-card">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
          '<h2 style="margin:0">Pesanan ' + (o.kode || "") + '</h2>' +
          '<span class="badge ' + statusClass(o.status) + '">' + (o.status || "-") + '</span></div>' +
          '<div class="pay-row"><span>Produk</span><span>' + (o.namaProduk || "-") + '</span></div>' +
          '<div class="pay-row"><span>Kategori</span><span>' + (o.kategori || "-") + '</span></div>' +
          '<div class="pay-row"><span>Harga</span><span>' + VOXY.formatRp(o.harga) + '</span></div>' +
          '<div class="pay-row"><span>Tanggal</span><span>' + VOXY.formatTanggal(o.createdAt) + '</span></div>' +
          (o.linkTarget ? '<div class="pay-row"><span>Link Target</span><span style="word-break:break-all">' + o.linkTarget + '</span></div>' : '') +
          (o.catatan ? '<div class="pay-row"><span>Catatan</span><span>' + o.catatan + '</span></div>' : '') +
          (o.catatanAdmin ? '<div class="pay-row"><span>Catatan Admin</span><span>' + o.catatanAdmin + '</span></div>' : '') +
          '</div><div class="pay-card" id="fileHasil"><p style="font-size:13px;color:var(--muted)">File hasil akan muncul di sini jika admin sudah mengirim.</p></div>';
        VOXY.getOrderFile(kode).then(function (f) {
          if (f && f.data) {
            var box = document.getElementById("fileHasil");
            if (box) box.innerHTML = '<a class="btn btn-sm" href="' + f.data + '" download="' + (f.nama || "hasil") + '">Download Hasil</a>';
          }
        });
      });
    });
  </script>
</body>
</html>
