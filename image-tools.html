<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Tools — VORTEX HUB</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo"><div class="logo-icon">V</div><span>VORTEX <span class="gradient-text">HUB</span></span></a>
      <div class="nav-links"><a href="index.html">Beranda</a><a href="tools.html">Tools</a><a href="ai.html">AI</a><a href="games.html">Games</a><a href="developer.html">Developer</a></div>
      <div class="nav-actions">
        <div class="search-box"><span class="search-icon">🔍</span><input type="text" placeholder="Cari..."><div class="search-results"></div></div>
        <button class="theme-toggle">🌙</button>
        <div id="nav-user-area"></div>
      </div>
    </div>
  </nav>

  <div class="page-wrapper">
    <main class="main-content">
      <div class="container">
        <div class="tool-layout with-sidebar">
          <aside class="tool-sidebar">
            <h4>Image Tools</h4>
            <a href="#resize" class="active">🖼️ Resize & Edit</a>
          </aside>

          <div class="tool-panel">
            <h2>Image Tools (Client-side)</h2>
            <p class="desc">Semua proses dilakukan di browser. File tidak diupload ke server.</p>

            <div class="form-group">
              <label class="form-label">Upload Gambar</label>
              <input type="file" class="form-control" id="img-upload" accept="image/*">
            </div>

            <div class="image-preview-box" id="img-preview-box">
              <canvas id="img-canvas" style="max-width:100%;max-height:350px"></canvas>
              <div class="placeholder" id="img-placeholder">Pilih gambar untuk preview</div>
            </div>
            <p class="text-muted mt-1" id="img-info">-</p>

            <div class="form-row mt-2">
              <div class="form-group"><label class="form-label">Lebar (px)</label><input type="number" class="form-control" id="img-width" placeholder="800"></div>
              <div class="form-group"><label class="form-label">Tinggi (px)</label><input type="number" class="form-control" id="img-height" placeholder="600"></div>
            </div>
            <button class="btn btn-primary" id="btn-img-resize">Resize</button>

            <div class="form-row mt-3">
              <div class="form-group"><label class="form-label">Rotasi</label>
                <select class="form-control" id="img-angle"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select>
              </div>
              <div class="form-group"><label class="form-label">Quality (0.1–1)</label><input type="number" class="form-control" id="img-quality" value="0.8" min="0.1" max="1" step="0.1"></div>
            </div>
            <div class="flex gap-1">
              <button class="btn btn-secondary" id="btn-img-rotate">Rotate</button>
              <button class="btn btn-secondary" id="btn-img-compress">Compress Info</button>
              <button class="btn btn-primary" id="btn-img-download">Download</button>
            </div>
            <p class="text-muted mt-1" id="img-compress-info"></p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span class="nav-icon">🏠</span>Home</a>
    <a href="tools.html" class="active"><span class="nav-icon">🧰</span>Tools</a>
    <a href="ai.html"><span class="nav-icon">🤖</span>AI</a>
    <a href="games.html"><span class="nav-icon">🎮</span>Games</a>
    <a href="profile.html"><span class="nav-icon">👤</span>Profil</a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/search.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/app.js"></script>
  <script src="js/image-tools.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      ImageTools.init();
      // Hide placeholder when canvas has content
      const observer = new MutationObserver(() => {
        const canvas = document.getElementById('img-canvas');
        const ph = document.getElementById('img-placeholder');
        if (canvas && canvas.width > 0) ph.style.display = 'none';
      });
    });
  </script>
</body>
</html>
