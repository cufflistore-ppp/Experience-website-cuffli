<!DOCTYPE html>
<html lang="id">
<head>
  <script src="auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pesanan - VOXY MARKET</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="market-page">

  <header class="market-header">
    <div class="market-brand">
      <img src="logo.png" alt="Logo" class="logo brand-logo">
      <div class="market-title">VOXY <span>MARKET</span> <i class="fa-solid fa-circle-check verified"></i></div>
    </div>
    <a href="akun.html" class="market-user" title="Profil Akun"><i class="fa-solid fa-circle-user"></i></a>
  </header>

  <div class="market-content">
    <h1 class="market-heading">Pesanan Saya</h1>
    <p class="market-sub">Status pesanan muncul otomatis. Admin kirim produk di sini juga.</p>

    <div class="market-search" style="margin-bottom:12px;">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="kodeInput" placeholder="Cari kode pesanan (opsional)..." autocomplete="off">
    </div>
    <button class="m-card-btn" style="margin-bottom:16px;" onclick="cekStatus()"><i class="fa-solid fa-search"></i> Cari Kode</button>

    <div id="detailPesanan" style="display:none;margin-bottom:16px;"></div>
    <div id="antrianList" class="antrian-list"></div>
  </div>

  <nav class="bottom-nav nav-5">
    <a href="digital.html" class="nav-item"><i class="fa-solid fa-bag-shopping"></i><span>Produk</span></a>
    <a href="kategori.html" class="nav-item"><i class="fa-solid fa-grip"></i><span>Kategori</span></a>
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="antrian.html" class="nav-item active"><i class="fa-solid fa-clipboard-list"></i><span>Pesanan</span></a>
    <a href="akun.html" class="nav-item"><i class="fa-solid fa-circle-user"></i><span>Akun</span></a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="global-orders.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="auth.js"></script>
  <script src="branding.js"></script>
  <script src="antrian.js"></script>
  <script src="script.js"></script>
  <script src="bgm.js"></script>
</body>
</html>
