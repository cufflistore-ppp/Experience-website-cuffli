<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Pembayaran - VOXY MARKET</title>


<link rel="stylesheet" href="css/pembayaran.css">


<script src="https://unpkg.com/lucide@latest"></script>


</head>


<body>





<!-- ================= HEADER ================= -->


<header class="payment-header">


<a href="detail-produk.html">

<i data-lucide="arrow-left"></i>

</a>




<div>

<h2>
Pembayaran
</h2>


<p>
Selesaikan pesanan kamu
</p>


</div>


</header>









<!-- ================= DETAIL PESANAN ================= -->


<section class="order-card">





<div class="product">


<img 
id="gambarProduk"
src="assets/produk4.png">





<div>


<h3 id="namaProduk">

Akun Netflix Premium

</h3>




<p>

Kode Pesanan:

<b id="kodePesanan">

VX000000

</b>

</p>




<p id="kategoriProduk">

Akun Sosmed Premium

</p>


</div>



</div>









<div class="price-box">


<span>

Total Pembayaran

</span>



<h1 id="hargaProduk">

Rp25.000

</h1>


</div>






</section><!-- ================= METODE PEMBAYARAN ================= -->


<section class="payment-box">





<h2>
Metode Pembayaran
</h2>







<div class="method active">


<i data-lucide="qr-code"></i>


<div>


<h3>
QRIS
</h3>


<p>
Scan QR untuk pembayaran
</p>


</div>


</div>









<!-- ================= QRIS ================= -->


<div class="qris">


<img 
src="assets/qris.jpg"
alt="QRIS">


<p>
Scan QRIS lalu upload bukti pembayaran
</p>


</div>









<!-- ================= UPLOAD BUKTI ================= -->


<h2>
Upload Bukti Pembayaran
</h2>





<div class="upload">


<i data-lucide="image"></i>



<p>
Pilih foto bukti pembayaran
</p>



<input 
id="buktiPembayaran"
type="file"
accept="image/*">


</div>








<!-- PREVIEW FOTO -->


<div class="preview">


<img 
id="previewBukti"
style="display:none;">


</div>









<!-- ================= KONFIRMASI ================= -->


<button 
class="confirm"
onclick="konfirmasiPembayaran()">



<i data-lucide="check"></i>



<span>
Konfirmasi Pembayaran
</span>



</button>





</section><!-- ================= CHAT ADMIN ================= -->


<a href="https://wa.me/6285726337940"
class="chat-admin">


<img src="assets/chat-admin.png">


</a>









<!-- ================= NAVBAR ================= -->


<nav>


<a href="home.html">


<i data-lucide="house"></i>


<span>
Home
</span>


</a>






<a href="riwayat.html">


<i data-lucide="clipboard-list"></i>


<span>
Transaksi
</span>


</a>






<a href="akun.html">


<i data-lucide="circle-user"></i>


<span>
Akun
</span>


</a>



</nav>









<!-- ================= SCRIPT ================= -->


<script src="js/pembayaran.js"></script>





<script>


lucide.createIcons();






// ================= AMBIL DATA PRODUK =================



let produk = JSON.parse(

localStorage.getItem("produkDipilih")

);





let kode =
"VX" + Math.floor(Math.random()*900000+100000);






if(produk){



document.getElementById("gambarProduk").src =
produk.gambar;





document.getElementById("namaProduk").innerHTML =
produk.nama;





document.getElementById("kategoriProduk").innerHTML =
produk.kategori;





document.getElementById("hargaProduk").innerHTML =
"Rp" + Number(produk.harga)
.toLocaleString("id-ID");



}





document.getElementById("kodePesanan").innerHTML =
kode;









// ================= PREVIEW BUKTI =================



let upload =
document.getElementById("buktiPembayaran");



upload.addEventListener(
"change",
function(){



let file = this.files[0];



if(file){


let reader = new FileReader();



reader.onload=function(e){



let img =
document.getElementById("previewBukti");



img.src=e.target.result;


img.style.display="block";



}



reader.readAsDataURL(file);



}



}

);





</script>







</body>

</html>
