<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran - VOXY MARKET</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <header class="app-header">
    <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
    <div class="logo-area"><span>Pembayaran</span></div>
    <div style="width:40px"></div>
  </header>
  <main class="page">
    <div class="pay-card">
      <h2>Ringkasan Pesanan</h2>
      <div class="pay-row"><span>Produk</span><span id="namaProduk">-</span></div>
      <div class="pay-row"><span>Kategori</span><span id="kategori">-</span></div>
      <div class="pay-row"><span>Total</span><span id="totalHarga">-</span></div>
    </div>
    <div class="pay-card">
      <h2>Transfer / QRIS</h2>
      <div class="qris-box">
        <img id="qrisImg" src="qris.jpg" alt="QRIS" onerror="this.style.display='none'">
        <p style="font-size:13px;color:var(--muted)">Scan QRIS atau transfer ke rekening di bawah</p>
      </div>
      <div class="rekening" id="rekeningBox">Memuat info rekening...</div>
    </div>
    <div class="pay-card">
      <h2>Upload Bukti Transfer</h2>
      <label class="upload-area">
        <i data-lucide="upload" style="width:28px;height:28px;margin-bottom:8px"></i>
        <div>Klik untuk upload foto bukti</div>
        <input type="file" id="buktiFile" accept="image/*">
      </label>
      <img id="previewBukti" class="preview-bukti hidden" alt="Preview">
    </div>
    <button class="btn" style="width:100%;margin-top:8px" id="btnKonfirmasi" onclick="konfirmasi()">Konfirmasi Pembayaran</button>
  </main>
  <script src="global-orders.js"></script>
  <script>
    lucide.createIcons();
    var produk = null, buktiDataUrl = null;
    VOXY.requireAuth().then(function (user) {
      VOXY.applyBrandingToPage();
      try { produk = JSON.parse(sessionStorage.getItem("produkDipilih") || "null"); } catch (e) { produk = null; }
      if (!produk) { alert("Produk tidak ditemukan"); window.location.href = "home.html"; return; }
      document.getElementById("namaProduk").textContent = produk.nama || "-";
      document.getElementById("kategori").textContent = produk.kategori || "-";
      document.getElementById("totalHarga").textContent = VOXY.formatRp(produk.harga);
      VOXY.getSettings().then(function (s) {
        s = s || {};
        document.getElementById("rekeningBox").innerHTML = "<b>Rekening:</b><br>" + (s.rekening || "Belum diset admin") +
          (s.waAdmin ? "<br><br><b>WA Admin:</b> " + s.waAdmin : "");
        if (s.qrisUrl) document.getElementById("qrisImg").src = s.qrisUrl;
      });
    });
    document.getElementById("buktiFile").addEventListener("change", function (e) {
      var file = e.target.files[0];
      if (!file) return;
      VOXY.fileToDataURL(file).then(function (url) {
        buktiDataUrl = url;
        var prev = document.getElementById("previewBukti");
        prev.src = url; prev.classList.remove("hidden");
      }).catch(function () { alert("Gagal membaca file"); });
    });
    function konfirmasi() {
      if (!produk) return;
      if (!buktiDataUrl) { alert("Upload bukti transfer dulu"); return; }
      var btn = document.getElementById("btnKonfirmasi");
      btn.disabled = true; btn.textContent = "Mengirim...";
      var user = VOXY.getCurrentUser();
      var order = {
        kode: VOXY.generateKode(),
        produkId: produk.id || "",
        namaProduk: produk.nama || "",
        kategori: produk.kategori || "",
        harga: Number(produk.harga) || 0,
        gambar: produk.gambar || "",
        status: "Menunggu",
        email: user ? user.email : "",
        uid: user ? user.uid : "",
        linkTarget: "",
        catatan: ""
      };
      VOXY.simpanOrder(order).then(function (kode) {
        return VOXY.simpanBukti(kode, buktiDataUrl).then(function () { return kode; });
      }).then(function (kode) {
        sessionStorage.removeItem("produkDipilih");
        var kat = (produk.kategori || "").toLowerCase();
        if (kat.indexOf("suntik") !== -1 || kat.indexOf("jasa") !== -1 || produk.butuhTarget) {
          sessionStorage.setItem("kodePesanan", kode);
          window.location.href = "jasa-link.html?kode=" + encodeURIComponent(kode);
          return;
        }
        if (VOXY.showToast) VOXY.showToast("Pesanan terkirim. Menunggu verifikasi admin.");
        setTimeout(function(){ window.location.href = "riwayat.html"; }, 900);
      }).catch(function (err) {
        alert(err.message || "Gagal menyimpan pesanan");
        btn.disabled = false; btn.textContent = "Konfirmasi Pembayaran";
      });
    }
  </script>
</body>
</html>
