<!DOCTYPE html>
<html lang="id">
<head>
  <script src="iframe-nav.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akun - ELZKII JOKI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .page-content { padding-bottom: 100px; }
    .akun-heading { text-align:center; margin: 8px 0 20px; color:#d91b7a!important; letter-spacing:1px; }
    .akun-card {
      position:relative; overflow:hidden; text-align:center;
      background:linear-gradient(145deg,#fff 0%,#fff2f8 100%)!important;
      border:1px solid #f2bfd8!important; border-radius:24px;
      padding:28px 20px 22px; margin:0 auto 20px; max-width:520px;
      box-shadow:0 12px 30px rgba(217,27,122,.10);
    }
    .akun-card:before { content:""; position:absolute; width:170px;height:170px;right:-80px;top:-90px;border-radius:50%;background:#ffe0ef; }
    .akun-avatar { width:94px;height:94px;border-radius:50%;object-fit:cover;border:4px solid #f4a8ce;margin:4px auto 14px;background:#fff;box-shadow:0 5px 16px rgba(217,27,122,.13);display:block; }
    .akun-avatar.placeholder { display:flex;align-items:center;justify-content:center;font-size:34px;color:#df4b98!important; }
    .akun-name { font-size:20px;font-weight:800;margin:0 0 5px;color:#8d2459!important; }
    .akun-email { font-size:13px;color:#ad6a8c!important;margin:0 0 18px;word-break:break-word; }
    .akun-status { position:relative;display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:6px 12px;border-radius:99px;margin-bottom:18px;font-weight:700;background:#fff0f7!important;color:#c52878!important;border:1px solid #f3c5dd; }
    .akun-status.on:before { content:"";width:7px;height:7px;border-radius:50%;background:#e21b83; }
    .akun-status.off:before { content:"";width:7px;height:7px;border-radius:50%;background:#e9a1c6; }
    .btn-google,.btn-logout { width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;padding:14px 16px;font-size:14px;font-weight:750;cursor:pointer; }
    .btn-google { background:#e21b83!important;color:#fff!important;border:1px solid #e21b83!important;box-shadow:0 7px 16px rgba(226,27,131,.18); }
    .btn-google:active { background:#b91568!important; }
    .btn-google:disabled { opacity:.65;cursor:wait; }
    .btn-google .g-icon { width:20px;height:20px;flex-shrink:0; }
    .btn-logout { background:#fff!important;border:1px solid #efb5d2!important;color:#c52878!important;margin-top:10px; }
    .btn-logout i { color:#c52878!important; }
    .akun-card #akunBody { position:relative; }
  </style>
</head>
<body>
<header class="header">
    <div class="brand">
      <img src="logo.jpg" class="logo" alt="ELZKII JOKI">
      <div>
        <h1>ELZKII JOKI <i class="fa-solid fa-circle-check verified"></i></h1>
        <p>Joki Kontak & Produk Digital</p>
      </div>
    </div>
  
    <div class="header-right">
</div>
  </header>

  <div class="page-content">
    <h2 class="akun-heading">AKUN SAYA</h2>

    <div class="akun-card" id="akunCard">
      <div class="akun-status off" id="akunStatus">Memuat...</div>
      <div id="akunBody">
        <div class="akun-avatar placeholder"><i class="fa-solid fa-user"></i></div>
        <div class="akun-name">Belum masuk</div>

      </div>
      <button type="button" class="btn-google" id="btnGoogle">
        <span class="g-icon" aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;color:#fff!important;">G</span>
        Masuk dengan Google
      </button>
      <button type="button" class="btn-logout" id="btnLogout" style="display:none;">
        <i class="fa-solid fa-right-from-bracket"></i> Keluar
      </button>
    </div>
  </div>

    <nav class="bottom-nav nav-7">
    <a href="riwayat.html" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i><span>Riwayat</span></a>
    <a href="joki.html" class="nav-item"><i class="fa-solid fa-shield-halved"></i><span>Joki</span></a>
    <a href="digital.html" class="nav-item"><i class="fa-solid fa-box"></i><span>Digital</span></a>
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="antrian.html" class="nav-item"><i class="fa-solid fa-clock"></i><span>Antrian</span></a>
    <a href="tentang.html" class="nav-item"><i class="fa-solid fa-circle-info"></i><span>Tentang</span></a>
    <a href="akun.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>Akun</span></a>
  </nav>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="ej-auth.js"></script>
  <script src="global-orders.js"></script>
  <script src="auth.js"></script>
  <script>
    function renderUser(user) {
      const status = document.getElementById("akunStatus");
      const body = document.getElementById("akunBody");
      const btnG = document.getElementById("btnGoogle");
      const btnL = document.getElementById("btnLogout");
      const configured = !!(window.ELZKIIAuth && window.ELZKIIAuth.auth && window.ELZKIIAuth.db);

      if (!configured) {
        status.className = "akun-status off";
        status.textContent = "Firebase belum di-setup";
        body.innerHTML =
          '<div class="akun-avatar placeholder"><i class="fa-solid fa-gear"></i></div>' +
          '<div class="akun-name">Setup diperlukan</div>' +
          '';
        btnG.disabled = true;
        btnG.style.display = "flex";
        btnL.style.display = "none";
        return;
      }

      if (user) {
        status.className = "akun-status on";
        status.textContent = "Sudah masuk";
        const photo = user.photoURL
          ? '<img class="akun-avatar" src="' + user.photoURL + '" alt="foto">'
          : '<div class="akun-avatar placeholder"><i class="fa-solid fa-user"></i></div>';
        body.innerHTML =
          photo +
          '<div class="akun-name">' + escapeHtml(user.displayName || "Pengguna") + "</div>" +
          '<div class="akun-email">' + escapeHtml(user.email || "-") + "</div>" + ((window.EJ && EJ.isAdmin && EJ.isAdmin(user)) || ["cufflistore@gmail.com","hengkipratamahmad@gmail.com"].includes(String(user.email || "").trim().toLowerCase())) ? '<a class="btn-google" style="margin:12px 0 0;text-decoration:none" href="admin.html"><i class="fa-solid fa-user-shield"></i> Menuju Panel Admin</a>' : '');
        btnG.style.display = "none";
        btnL.style.display = "block";
      } else {
        status.className = "akun-status off";
        status.textContent = "Belum masuk";
        body.innerHTML =
          '<div class="akun-avatar placeholder"><i class="fa-solid fa-user"></i></div>' +
          '<div class="akun-name">Belum masuk</div>' +
          '';
        btnG.style.display = "flex";
        btnG.disabled = false;
        btnL.style.display = "none";
      }
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const G_ICON = `<span class="g-icon" aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;color:#fff!important;">G</span>`;

    document.getElementById("btnGoogle").addEventListener("click", async function () {
      const btn = this;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menghubungkan...';
      try {
        const user = await window.ELZKIIAuth.loginGoogle();
        if (user) renderUser(user);
      } catch (e) {
        const msg = (e && e.message) ? e.message : String(e);
        alert(msg);
        console.error(e);
      } finally {
        btn.disabled = false;
        btn.innerHTML = G_ICON + " Masuk dengan Google";
      }
    });

    document.getElementById("btnLogout").addEventListener("click", async function () {
      try {
        await window.ELZKIIAuth.logout();
      } catch (e) {
        alert("Gagal keluar");
      }
    });

    document.addEventListener("DOMContentLoaded", async function () {
      if (window.ELZKIIAuth) {
        try {
          await window.ELZKIIAuth.handleRedirectResult();
        } catch (e) {}
        try {
          const err = sessionStorage.getItem("elzkii_auth_err");
          if (err) {
            sessionStorage.removeItem("elzkii_auth_err");
            let hint = err;
            if (/unauthorized-domain/i.test(err)) {
              hint = "Domain belum diizinkan di Firebase Authorized domains.\nTambah: " + location.hostname;
            }
            alert("Login gagal: " + hint);
          }
        } catch (e) {}
        window.ELZKIIAuth.onAuthChange(renderUser);
      } else {
        renderUser(null);
      }
    });
  </script>
<script src="footer.js"></script>
</body>
</html>
