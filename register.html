<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — VORTEX HUB</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="logo">
        <div class="logo-icon">V</div>
        <span>VORTEX HUB</span>
      </a>
      <h2>Buat Akun</h2>
      <p class="subtitle">Gabung VORTEX HUB gratis</p>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label">Nama Lengkap</label>
          <input type="text" class="form-control" id="name" placeholder="Nama kamu" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Minimal 6 karakter" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Daftar</button>
      </form>

      <div class="auth-footer">
        Sudah punya akun? <a href="login.html">Masuk</a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Theme.init();
    Toast.init();
    
    if (Auth.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const result = Auth.register(name, email, password);
      
      if (result.success) {
        Toast.show(result.message, 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } else {
        Toast.show(result.message, 'error');
      }
    });
  </script>
</body>
</html>
