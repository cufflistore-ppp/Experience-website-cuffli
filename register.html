<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — CUFFLI SOCIAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading-screen">
    <div class="loading-logo">CUFFLI SOCIAL</div>
    <div class="loading-text">Loading...</div>
  </div>

  <div class="auth-page">
    <div class="card auth-card fade-in">
      <div class="logo" style="justify-content:center;margin-bottom:8px;font-size:1.4rem">
        <i class="fa-solid fa-bolt"></i> CUFFLI SOCIAL
      </div>
      <h1>Daftar Akun</h1>
      <p class="subtitle">Buat akun gratis untuk mulai memesan</p>

      <form id="register-form">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" class="form-control" id="reg-name" placeholder="Nama kamu" required>
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" class="form-control" id="reg-user" placeholder="username unik" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" id="reg-email" placeholder="email@contoh.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="reg-pass" placeholder="Minimal 6 karakter" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          <i class="fa-solid fa-user-plus"></i> DAFTAR
        </button>
      </form>

      <div class="auth-footer">
        Sudah punya akun? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const username = document.getElementById('reg-user').value.trim().toLowerCase();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-pass').value;

      const users = getUsers();
      if (users.some(u => u.username === username)) {
        showToast('Username sudah digunakan', 'error');
        return;
      }
      if (users.some(u => u.email === email)) {
        showToast('Email sudah terdaftar', 'error');
        return;
      }

      const newUser = {
        id: 'user-' + Date.now(),
        username,
        email,
        password,
        name,
        role: 'user',
        balance: 0,
        createdAt: new Date().toISOString()
      };

      users.push(newUser);
      saveUsers(users);
      setCurrentUser(newUser);
      showToast('Akun berhasil dibuat! Selamat datang.', 'success');
      setTimeout(() => window.location.href = 'profil.html', 1000);
    });
  </script>
</body>
</html>
