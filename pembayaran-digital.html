<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Produk Digital</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body><main class="page-content" style="max-width:520px;margin:auto"><div class="form-section" style="text-align:center"><img src="logo.jpg" style="width:110px;height:110px;object-fit:cover;border-radius:20px"><h2>Konfirmasi Produk Digital</h2><p id="item"></p><h2 id="price" class="harga"></h2><label>Nama kamu</label><input id="nama" placeholder="Nama / store" required><label>Email akun website (untuk menerima produk)</label><input id="email" type="email" placeholder="email yang terdaftar di website" required><label>Nomor WhatsApp</label><input id="wa" placeholder="08xxxxxxxxxx" required><button class="btn-buat" id="send">Lanjutkan ke WhatsApp</button><p style="font-size:12px;color:#9bb0c8;margin-top:12px">Admin akan mengonfirmasi pesanan terlebih dahulu. Produk digital dikirim melalui halaman akun website setelah diproses.</p></div></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="ej-auth.js"></script><script src="global-orders.js"></script><script>const q=new URLSearchParams(location.search),item=q.get('paket')||'Produk Digital',price=Number(q.get('total')||0);document.getElementById('item').textContent=item;document.getElementById('price').textContent='Rp '+price.toLocaleString('id-ID');if(window.EJ?.auth?.currentUser?.email)document.getElementById('email').value=window.EJ.auth.currentUser.email;document.getElementById('send').onclick=async()=>{const nama=document.getElementById('nama').value.trim(),email=document.getElementById('email').value.trim(),wa=document.getElementById('wa').value.trim();if(!nama||!email||!document.getElementById('email').checkValidity()||wa.replace(/\D/g,'').length<10){alert('Isi nama dan nomor WhatsApp yang valid.');return;}const kode='EJ-DIGITAL-'+Date.now().toString().slice(-8),o={kode,nama,email,wa,paket:item,total:'Rp '+price.toLocaleString('id-ID'),finalAmount:price,jenis:'digital',jenisOrder:'Digital',status:'Menunggu konfirmasi WhatsApp',waktu:new Date().toLocaleString('id-ID'),createdAt:Date.now()};try{if(window.VoxyyOrders?.addOrder)await VoxyyOrders.addOrder(o);else{let a=JSON.parse(localStorage.getItem('voxyy_orders')||'[]');a.unshift(o);localStorage.setItem('voxyy_orders',JSON.stringify(a));}}catch(e){alert('Gagal menyimpan order. Coba lagi.');return;}localStorage.setItem('voxyy_saved_kode',kode);const m=`Halo Admin ELZKII JOKI, saya ingin order PRODUK DIGITAL\nKode: ${kode}\nNama: ${nama}\nEmail akun website: ${email}\nWhatsApp: ${wa}\nProduk: ${item}\nTotal: Rp ${price.toLocaleString('id-ID')}\nMohon konfirmasi order saya.`;location.href='https://wa.me/6282364307699?text='+encodeURIComponent(m);};</script><script src="footer.js"></script></body></html>
