<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaksi - VOXY MARKET</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="logo-area"><img src="logo.png" alt="VOXY"><span>VOXY MARKET</span></div>
  </header>
  <main class="page">
    <div class="order-list" id="listRiwayat"><div class="empty-state">Memuat...</div></div>
  </main>
    <nav class="bottom-nav">
    <a href="home.html"><i data-lucide="home"></i>Home</a>
    <a href="riwayat.html" class="active"><i data-lucide="receipt"></i>Transaksi</a>
    <a href="akun.html"><i data-lucide="user"></i>Akun</a>
  </nav>
  <script src="global-orders.js"></script>
  <script>
    lucide.createIcons();
    function statusClass(s) {
      s = (s || "").toLowerCase();
      if (s.indexOf("menunggu") !== -1) return "menunggu";
      if (s.indexOf("proses") !== -1) return "diproses";
      if (s.indexOf("selesai") !== -1) return "selesai";
      if (s.indexOf("tolak") !== -1) return "ditolak";
      return "menunggu";
    }
    VOXY.requireAuth().then(function (user) {
      VOXY.listenOrders(function (orders) {
        var mine = (orders || []).filter(function (o) {
          return o.email === user.email || o.uid === user.uid;
        });
        mine.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
        var el = document.getElementById("listRiwayat");
        if (!mine.length) { el.innerHTML = '<div class="empty-state">Belum ada transaksi</div>'; return; }
        el.innerHTML = mine.map(function (o) {
          var img = o.gambar || "produk1.png";
          var st = o.status || "Menunggu";
          return '<a class="order-item" href="detail-transaksi.html?kode=' + encodeURIComponent(o.kode) + '">' +
            '<img class="thumb" src="' + img + '" onerror="this.src=\'produk1.png\'">' +
            '<div class="info"><h3>' + (o.namaProduk || "-") + '</h3>' +
            '<div class="meta">' + (o.kode || "") + ' · ' + VOXY.formatTanggal(o.createdAt) + '</div>' +
            '<div class="meta" style="margin-top:4px">' + VOXY.formatRp(o.harga) +
            ' · <span class="badge ' + statusClass(st) + '">' + st + '</span></div></div></a>';
        }).join("");
      });
    });
  </script>
</body>
</html>
