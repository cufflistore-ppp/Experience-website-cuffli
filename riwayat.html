<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riwayat Digital - ELZKII JOKI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body><header class="header"><div class="brand"><img class="logo" src="logo.jpg"><div><h1>ELZKII JOKI</h1><p>Produk Digital Saya</p></div></div></header><main class="page-content"><h2>PRODUK & RIWAYAT DIGITAL</h2><p>Produk digital yang dikirim admin ke akun kamu akan muncul di sini.</p><div id="history" style="margin-top:14px">Memuat...</div></main><nav class="bottom-nav nav-7">

  </nav><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="ej-auth.js"></script><script>
const box=document.getElementById('history');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
EJ.auth.onAuthStateChanged(async u=>{if(!u)return;try{
 const snap=await EJ.db.ref('deliveries/'+u.uid).once('value');const data=snap.val()||{};const deliveries=Object.values(data).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 const delivered=deliveries.map(o=>`<article style="background:#fff;border:1px solid #f2bfd8;padding:14px;border-radius:12px;margin:9px 0;color:#54223f"><b>${esc(o.title||'Produk Digital')}</b>${o.note?`<p style="white-space:pre-wrap">${esc(o.note)}</p>`:''}${o.link?`<p><a href="${esc(o.link)}" target="_blank" rel="noopener">Download / Buka Produk</a></p>`:''}<small>Dikirim: ${new Date(o.createdAt||Date.now()).toLocaleString('id-ID')}</small></article>`).join('');
 let local=[];try{local=JSON.parse(localStorage.getItem('voxyy_digital_history')||'[]')}catch(e){}
 const history=local.map(o=>`<article style="background:#fff;border:1px solid #f2bfd8;padding:14px;border-radius:12px;margin:9px 0;color:#54223f"><b>Order: ${esc(o.paket||'Produk Digital')}</b><p>${esc(o.kode||'')}</p><p>Rp ${Number(o.total||0).toLocaleString('id-ID')}</p><small>${esc(o.waktu||'')} · ${esc(o.status||'Menunggu konfirmasi')}</small></article>`).join('');
 box.innerHTML='<h3>Produk yang Dikirim Admin</h3>'+(delivered||'<p>Belum ada produk digital yang dikirim ke akun ini.</p>')+'<h3 style="margin-top:22px">Riwayat Order Digital</h3>'+(history||'<p>Belum ada order digital di perangkat ini.</p>');
 }catch(e){box.textContent='Gagal memuat riwayat. Periksa Firebase Rules.';}});
</script><script src="footer.js"></script>
</body></html>
