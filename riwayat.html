<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Riwayat Transaksi - VOXY MARKET</title>


<link rel="stylesheet" href="css/riwayat.css">


<script src="https://unpkg.com/lucide@latest"></script>


</head>


<body>



<!-- ================= HEADER ================= -->


<header class="transaction-header">


<div class="logo-area">

<img src="assets/logo.png">

</div>



<div>

<h2>
Riwayat Transaksi
</h2>


<p>
Pantau pesanan kamu
</p>


</div>



</header>









<!-- ================= FILTER ================= -->


<section class="filter">


<button class="active">

Semua

</button>


<button>

Menunggu

</button>


<button>

Diproses

</button>


<button>

Selesai

</button>


</section>









<!-- ================= LIST TRANSAKSI ================= -->


<section 
class="transaction-list"
id="transactionList">


</section><!-- ================= CHAT ADMIN ================= -->


<a href="https://wa.me/6285726337940"
class="chat-admin">


<img src="assets/chat-admin.png">


</a>









<!-- ================= NAVBAR ================= -->


<nav>


<a href="home.html">


<i data-lucide="house"></i>


<span>
Home
</span>


</a>






<a href="riwayat.html"
class="active">


<i data-lucide="clipboard-list"></i>


<span>
Transaksi
</span>


</a>







<a href="akun.html">


<i data-lucide="circle-user"></i>


<span>
Akun
</span>


</a>



</nav>









<!-- ================= SCRIPT ================= -->


<script>


lucide.createIcons();





// ================= LOAD TRANSAKSI =================



let dataTransaksi = JSON.parse(

localStorage.getItem("riwayatTransaksi")

) || [];





let list = document.getElementById(
"transactionList"
);





if(dataTransaksi.length === 0){



list.innerHTML = `


<div class="empty">


<i data-lucide="clipboard-x"></i>


<h3>
Belum ada transaksi
</h3>


<p>
Pesanan kamu akan muncul di sini
</p>


</div>


`;



}

else{



dataTransaksi.reverse().forEach((item,index)=>{





list.innerHTML += `



<div class="transaction-card">



<div class="product-top">



<img src="${item.gambar || 'assets/logo.png'}">





<div>


<h3>

${item.namaProduk}

</h3>



<p>

Kode Pesanan:

<b>

${item.kode}

</b>

</p>



<p>

${item.tanggal}

</p>



</div>



</div>









<div class="status waiting">


<i data-lucide="clock"></i>


${item.status}


</div>









<div class="transaction-bottom">



<strong>

Rp${Number(item.harga)
.toLocaleString("id-ID")}

</strong>







<button onclick="lihatDetail(${index})">

Detail

</button>





</div>



</div>



`;



});



}






lucide.createIcons();









// ================= DETAIL =================



function lihatDetail(index){



let data = dataTransaksi[index];



localStorage.setItem(

"detailTransaksi",

JSON.stringify(data)

);





window.location.href =
"detail-transaksi.html";



}



</script>

</body>

</html>
