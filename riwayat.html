<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riwayat - ELZKII JOKI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>.history-empty{min-height:55vh;display:flex;align-items:center;justify-content:center;color:#b8aeb5;font-size:48px}.history-card{background:#fff;border:1px solid #f2bfd8;padding:14px;border-radius:12px;margin:9px 0;color:#68616a}</style></head><body><header class="header"><div class="brand"><img class="logo" src="logo.jpg" alt=""><div><h1>ELZKII JOKI</h1><p>Riwayat</p></div></div></header><main class="page-content"><div id="history" class="history-empty"><i class="fa-regular fa-clock" aria-label="Belum ada riwayat"></i></div></main><nav class="bottom-nav nav-7"><a href="riwayat.html" class="nav-item active"><i class="fa-solid fa-clock-rotate-left"></i><span>Riwayat</span></a><a href="joki.html" class="nav-item"><i class="fa-solid fa-shield-halved"></i><span>Joki</span></a><a href="digital.html" class="nav-item"><i class="fa-solid fa-box"></i><span>Digital</span></a><a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a><a href="antrian.html" class="nav-item"><i class="fa-solid fa-clock"></i><span>Antrian</span></a><a href="tentang.html" class="nav-item"><i class="fa-solid fa-circle-info"></i><span>Tentang</span></a><a href="akun.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Akun</span></a></nav>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="ej-auth.js"></script><script>
const box=document.getElementById('history');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
EJ.auth.onAuthStateChanged(async u=>{if(!u)return;try{const snap=await EJ.db.ref('deliveries/'+u.uid).once('value');const deliveries=Object.values(snap.val()||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));let local=[];try{local=JSON.parse(localStorage.getItem('voxyy_digital_history')||'[]')}catch(e){}const rows=deliveries.map(o=>`<article class="history-card"><b>${esc(o.title||'Produk Digital')}</b>${o.note?`<p style="white-space:pre-wrap">${esc(o.note)}</p>`:''}${o.attachment?.data?`<p><a href="${o.attachment.data}" download="${esc(o.attachment.name||'produk')}"><i class="fa-solid fa-download"></i> Download ${esc(o.attachment.name||'File Produk')}</a></p>`:''}${o.link?`<p><a href="${esc(o.link)}" target="_blank" rel="noopener">Download / Buka Produk</a></p>`:''}<small>${new Date(o.createdAt||Date.now()).toLocaleString('id-ID')}</small></article>`).join('')+local.map(o=>`<article class="history-card"><b>${esc(o.paket||'Produk Digital')}</b><p>${esc(o.kode||'')} · Rp ${Number(o.total||0).toLocaleString('id-ID')}</p><small>${esc(o.waktu||'')} · ${esc(o.status||'Menunggu konfirmasi')}</small></article>`).join('');if(rows){box.className='';box.innerHTML=rows}}catch(e){console.warn('Riwayat belum dapat dimuat',e)}});
</script><script src="footer.js"></script></body></html>
