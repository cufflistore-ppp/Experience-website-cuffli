<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Joki - VOXY MARKET</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <header class="app-header">
    <button class="icon-btn" onclick="location.href='joki.html'"><i data-lucide="arrow-left"></i></button>
    <div class="logo-area"><span id="pageTitle">Order Joki</span></div>
    <div style="width:40px"></div>
  </header>

  <main class="page">
    <div class="joki-box" id="paketInfo"></div>

    <div class="joki-box">
      <div class="joki-box-head">
        <span class="joki-step">2</span>
        <span>Data Order</span>
      </div>
      <div class="form-group">
        <label>Nama Store</label>
        <input type="text" id="jokiStore" placeholder="Nama store / brand" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Nomor WhatsApp (62…)</label>
        <input type="tel" id="jokiWa" placeholder="62812xxxxxxx" autocomplete="off">
      </div>
      <div class="joki-preview-wrap">
        <div class="joki-preview-label">Format teks (otomatis)</div>
        <div class="joki-preview" id="jokiPreview"></div>
      </div>
    </div>

    <div class="joki-box" id="includeBox">
      <div class="joki-box-head">
        <span class="joki-step">3</span>
        <span>Paket tambahan</span>
      </div>
      <div id="includeList"></div>
    </div>

    <div class="joki-total-box">
      <span>Total bayar</span>
      <strong id="jokiTotal">Rp 0</strong>
    </div>
    <button type="button" class="btn" style="width:100%;margin-top:12px" id="btnOrderJoki">Lanjut Bayar</button>
  </main>

  <nav class="bottom-nav">
    <a href="home.html"><i data-lucide="home"></i>Home</a>
    <a href="riwayat.html"><i data-lucide="receipt"></i>Transaksi</a>
    <a href="akun.html"><i data-lucide="user"></i>Akun</a>
  </nav>

  <script src="global-orders.js"></script>
  <script>
    lucide.createIcons();
    var PAKET_MAP = {
      "joki-20jam": { id: "joki-20jam", nama: "Joki 20 Jam", labelTengah: "20 Jam", desc: "20 jam + SW + share 10GB", harga: 500 },
      "joki-1hari": { id: "joki-1hari", nama: "Joki 1 Hari", labelTengah: "1 Hari", desc: "1 hari + SW + share all GB", harga: 1000 },
      "joki-2hari": { id: "joki-2hari", nama: "Joki 2 Hari", labelTengah: "2 Hari", desc: "2 hari + SW + share all GB", harga: 2000 },
      "joki-3hari": { id: "joki-3hari", nama: "Joki 3 Hari", labelTengah: "3 Hari", desc: "3 hari + SW + share all GB", harga: 3000 },
      "joki-4hari": { id: "joki-4hari", nama: "Joki 4 Hari", labelTengah: "4 Hari", desc: "4 hari + SW + share all GB", harga: 4000 },
      "joki-5hari": { id: "joki-5hari", nama: "Joki 5 Hari", labelTengah: "5 Hari", desc: "5 hari + SW + share all GB", harga: 5000 },
      "joki-permanen": { id: "joki-permanen", nama: "Joki Permanen", labelTengah: "Permanen", desc: "Permanen link tree + SW tebar", harga: 6000 }
    };
    var INCLUDES = [
      { id: "plus20jam", nama: "+ 20 Jam", harga: 500 },
      { id: "plus1hari", nama: "+ 1 Hari", harga: 1000 },
      { id: "plus2hari", nama: "+ 2 Hari", harga: 2000 },
      { id: "plus3hari", nama: "+ 3 Hari", harga: 3000 },
      { id: "plus4hari", nama: "+ 4 Hari", harga: 4000 },
      { id: "plus5hari", nama: "+ 5 Hari", harga: 5000 },
      { id: "prioritas", nama: "Prioritas Antrian", harga: 8000 }
    ];
    var selectedInclude = {};
    var paket = null;

    function normWa(n) {
      n = String(n || "").replace(/\D/g, "");
      if (n.startsWith("0")) n = "62" + n.slice(1);
      if (n && !n.startsWith("62")) n = "62" + n;
      return n;
    }
    function buildPreview() {
      var store = document.getElementById("jokiStore").value.trim() || "Nama Store";
      var wa = normWa(document.getElementById("jokiWa").value) || "628…";
      var tengah = paket ? (paket.labelTengah + " · " + store) : store;
      return "*_SV BUYER DUBAI VOXY🧿_*\n        " + tengah + "\n*_SV ; " + store + "_*\nWa.me/" + wa + "\n\n*#NAMBAH VIEW SW + KONTAK + SELLER + BUYYER + DLL 🌤️🌈*";
    }
    function refreshPreview() {
      document.getElementById("jokiPreview").textContent = buildPreview();
      updateTotal();
    }
    function updateTotal() {
      if (!paket) return;
      var extra = 0;
      var names = [];
      INCLUDES.forEach(function (inc) {
        if (selectedInclude[inc.id]) {
          extra += inc.harga;
          names.push(inc.nama);
        }
      });
      document.getElementById("jokiTotal").textContent = VOXY.formatRp(Number(paket.harga) + extra);
    }
    function toggleInclude(id) {
      selectedInclude[id] = !selectedInclude[id];
      renderIncludes();
      updateTotal();
    }
    function renderIncludes() {
      document.getElementById("includeList").innerHTML = INCLUDES.map(function (inc) {
        var on = !!selectedInclude[inc.id];
        return (
          '<div class="joki-row' + (on ? ' is-on' : '') + '">' +
            '<div class="joki-row-info"><div class="joki-row-name">' + inc.nama + '</div></div>' +
            '<div class="joki-row-right">' +
              '<span class="joki-row-price">+' + VOXY.formatRp(inc.harga) + '</span>' +
              '<button type="button" class="joki-row-btn' + (on ? ' on' : '') + '" onclick="toggleInclude(\'' + inc.id + '\')">' +
                (on ? 'Dipilih' : 'Pilih') +
              '</button>' +
            '</div>' +
          '</div>'
        );
      }).join("");
    }
    function blockCopy(el) {
      ["copy", "cut", "contextmenu", "selectstart"].forEach(function (ev) {
        el.addEventListener(ev, function (e) { e.preventDefault(); });
      });
    }

    var id = new URLSearchParams(location.search).get("id") || "";
    paket = PAKET_MAP[id] || null;
    if (!paket) {
      document.getElementById("paketInfo").innerHTML = '<div class="empty-state">Paket tidak ditemukan. <a href="joki.html">Kembali</a></div>';
      document.getElementById("btnOrderJoki").disabled = true;
    } else {
      document.getElementById("pageTitle").textContent = paket.nama;
      document.getElementById("paketInfo").innerHTML =
        '<div class="joki-box-head"><span class="joki-step">1</span><span>Paket dipilih</span></div>' +
        '<div class="joki-row" style="border:none;padding:0">' +
          '<div class="joki-row-info">' +
            '<div class="joki-row-name">' + paket.nama + '</div>' +
            '<div class="joki-row-desc">' + paket.desc + '</div>' +
          '</div>' +
          '<div class="joki-row-right"><span class="joki-row-price">' + VOXY.formatRp(paket.harga) + '</span></div>' +
        '</div>';
      refreshPreview();
      if (paket.id === "joki-permanen") {
        var box = document.getElementById("includeBox");
        if (box) box.style.display = "none";
      } else {
        renderIncludes();
      }
    }

    document.getElementById("jokiStore").addEventListener("input", refreshPreview);
    document.getElementById("jokiWa").addEventListener("input", refreshPreview);
    blockCopy(document.getElementById("jokiPreview"));

    document.getElementById("btnOrderJoki").onclick = function () {
      if (!paket) return;
      var store = document.getElementById("jokiStore").value.trim();
      var wa = normWa(document.getElementById("jokiWa").value);
      if (!store) return alert("Isi nama store");
      if (!wa || wa.length < 10) return alert("Isi nomor WhatsApp valid");
      var user = VOXY.getCurrentUser && VOXY.getCurrentUser();
      if (!user) return (location.href = "login.html");

      var includes = [];
      var extra = 0;
      INCLUDES.forEach(function (inc) {
        if (selectedInclude[inc.id]) {
          includes.push({ id: inc.id, nama: inc.nama, harga: inc.harga });
          extra += inc.harga;
        }
      });
      var total = Number(paket.harga) + extra;
      var serobot = !!selectedInclude.prioritas;
      var btn = document.getElementById("btnOrderJoki");
      btn.disabled = true;
      btn.textContent = "Menyimpan...";

      VOXY.simpanOrder({
        jenis: "joki",
        produkId: paket.id,
        nama: paket.nama,
        kategori: "Joki",
        harga: total,
        hargaDasar: paket.harga,
        jokiIncludes: includes,
        serobot: serobot,
        serobotBiaya: serobot ? 8000 : 0,
        status: "Menunggu",
        jokiStore: store,
        jokiNamaJB: store,
        jokiWa: wa,
        jokiLabel: paket.labelTengah,
        jokiPreview: buildPreview(),
        deskripsi: paket.desc,
        uid: user.uid,
        email: user.email || ""
      }).then(function (kode) {
        location.href = "pembayaran.html?kode=" + encodeURIComponent(kode);
      }).catch(function (e) {
        alert(e.message || "Gagal buat order");
        btn.disabled = false;
        btn.textContent = "Lanjut Bayar";
      });
    };

    VOXY.requireAuth().then(function () {});
  </script>
</body>
</html>
