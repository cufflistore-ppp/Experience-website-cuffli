<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — VORTEX HUB</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo"><div class="logo-icon">V</div><span>VORTEX <span class="gradient-text">HUB</span></span></a>
      <div class="nav-links"><a href="index.html">Beranda</a><a href="tools.html">Tools</a><a href="ai.html">AI</a><a href="games.html">Games</a><a href="developer.html">Developer</a></div>
      <div class="nav-actions">
        <button class="theme-toggle">🌙</button>
        <div id="nav-user-area"></div>
      </div>
    </div>
  </nav>

  <div class="page-wrapper">
    <main class="main-content">
      <div class="container" style="max-width:600px">
        <h1>Profil Pengguna</h1>
        
        <div class="card mt-2" id="profile-guest" style="display:none">
          <p class="text-center">Kamu belum login.</p>
          <div class="flex-center gap-1 mt-2">
            <a href="login.html" class="btn btn-primary">Masuk</a>
            <a href="register.html" class="btn btn-secondary">Daftar</a>
          </div>
        </div>

        <div class="card mt-2" id="profile-user" style="display:none">
          <div class="text-center mb-3">
            <div class="user-avatar" style="width:80px;height:80px;font-size:2rem;margin:0 auto" id="profile-avatar">U</div>
            <h2 id="profile-name" class="mt-2">User</h2>
            <p class="text-muted" id="profile-email">email@example.com</p>
            <span class="badge" id="profile-role">user</span>
          </div>

          <form id="profile-form">
            <div class="form-group">
              <label class="form-label">Nama</label>
              <input type="text" class="form-control" id="edit-name">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Simpan Perubahan</button>
          </form>

          <div class="mt-3 flex gap-1">
            <a href="dashboard.html" class="btn btn-secondary btn-block">Dashboard</a>
            <a href="settings.html" class="btn btn-secondary btn-block">Pengaturan</a>
          </div>
          <button class="btn btn-outline btn-block mt-2" style="border-color:var(--danger);color:var(--danger)" onclick="Auth.logout()">Logout</button>
        </div>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span class="nav-icon">🏠</span>Home</a>
    <a href="tools.html"><span class="nav-icon">🧰</span>Tools</a>
    <a href="ai.html"><span class="nav-icon">🤖</span>AI</a>
    <a href="games.html"><span class="nav-icon">🎮</span>Games</a>
    <a href="profile.html" class="active"><span class="nav-icon">👤</span>Profil</a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/search.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = Storage.getUser();
      if (!user) {
        document.getElementById('profile-guest').style.display = 'block';
      } else {
        document.getElementById('profile-user').style.display = 'block';
        document.getElementById('profile-name').textContent = user.name;
        document.getElementById('profile-email').textContent = user.email;
        document.getElementById('profile-role').textContent = user.role || 'user';
        document.getElementById('profile-avatar').textContent = (user.name || 'U').charAt(0).toUpperCase();
        document.getElementById('edit-name').value = user.name || '';

        document.getElementById('profile-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('edit-name').value.trim();
          if (!name) return Toast.show('Nama tidak boleh kosong', 'warning');
          const result = Auth.updateProfile({ name });
          if (result.success) {
            Toast.show(result.message, 'success');
            document.getElementById('profile-name').textContent = name;
            document.getElementById('profile-avatar').textContent = name.charAt(0).toUpperCase();
            Navbar.renderUserMenu();
          }
        });
      }
    });
  </script>
</body>
</html>
